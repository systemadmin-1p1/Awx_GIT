
---
# ============================================================
# PLAY 1: DOWNLOAD UYUNI REPOSITORY KEY ON AWX
# ============================================================

- name: Download Uyuni repository key on AWX
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    awx_stage_dir: "/tmp/uyuni-client-tools"
    uyuni_repo_url: "https://download.opensuse.org/repositories/systemsmanagement:/Uyuni:/Master:/Ubuntu2404-Uyuni-Client-Tools/xUbuntu_24.04"

    awx_release_key: "/tmp/uyuni-client-tools/Release.key"

  tasks:

    - name: Create temporary directory on AWX
      ansible.builtin.file:
        path: "{{ awx_stage_dir }}"
        state: directory
        mode: "0755"

    - name: Download Uyuni repository Release.key
      ansible.builtin.get_url:
        url: "{{ uyuni_repo_url }}/Release.key"
        dest: "{{ awx_release_key }}"
        mode: "0644"
        validate_certs: true

    - name: Verify downloaded repository key
      ansible.builtin.stat:
        path: "{{ awx_release_key }}"
      register: awx_key_check

    - name: Validate downloaded repository key
      ansible.builtin.assert:
        that:
          - awx_key_check.stat.exists
          - awx_key_check.stat.isreg
          - awx_key_check.stat.size | int > 0
        fail_msg: "Uyuni repository key is missing or empty."

    - name: Show AWX preparation result
      ansible.builtin.debug:
        msg: "Uyuni repository key downloaded successfully on AWX."


# ============================================================
# PLAY 2: INSTALL AND CONFIGURE UYUNI CLIENT ON TARGETS
# ============================================================

- name: Install and configure Uyuni Salt Minion
  hosts: "all:!localhost"
  gather_facts: true
  become: true
  serial: 5

  vars:

    # AWX source
    awx_release_key: "/tmp/uyuni-client-tools/Release.key"

    # Target configuration
    target_keyring_dir: "/etc/apt/keyrings"
    target_keyring_file: "/etc/apt/keyrings/uyuni-client-tools.asc"
    target_repo_file: "/etc/apt/sources.list.d/uyuni-client-tools.list"

    # Uyuni repository
    uyuni_repo_url: "https://download.opensuse.org/repositories/systemsmanagement:/Uyuni:/Master:/Ubuntu2404-Uyuni-Client-Tools/xUbuntu_24.04"

    # Uyuni server and activation key
    uyuni_master: "uyuni.1point1.in"
    uyuni_activation_key: "1-ubuntu-24.04-pool-amd64-uyuni"

  pre_tasks:

    - name: Verify Ubuntu 24.04 AMD64 operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "Debian"
          - ansible_facts['distribution_version'] == "24.04"
          - ansible_facts['architecture'] == "x86_64"
        fail_msg: "This playbook supports Ubuntu 24.04 / Linux Lite 7.x AMD64 only."

    - name: Verify AWX repository key exists
      ansible.builtin.stat:
        path: "{{ awx_release_key }}"
      delegate_to: localhost
      become: false
      register: awx_key_check

    - name: Validate AWX repository key
      ansible.builtin.assert:
        that:
          - awx_key_check.stat.exists
          - awx_key_check.stat.size | int > 0
        fail_msg: "Repository key is missing on AWX."

    - name: Verify Uyuni server hostname resolves
      ansible.builtin.command:
        argv:
          - getent
          - hosts
          - "{{ uyuni_master }}"
      register: uyuni_hostname_check
      changed_when: false
      failed_when: uyuni_hostname_check.rc != 0

    - name: Display Uyuni server hostname
      ansible.builtin.debug:
        msg: "Uyuni server resolved: {{ uyuni_hostname_check.stdout }}"

  tasks:

    - name: Create APT keyring directory
      ansible.builtin.file:
        path: "{{ target_keyring_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Transfer Uyuni repository key from AWX
      ansible.builtin.copy:
        src: "{{ awx_release_key }}"
        dest: "{{ target_keyring_file }}"
        owner: root
        group: root
        mode: "0644"

    - name: Verify transferred repository key
      ansible.builtin.stat:
        path: "{{ target_keyring_file }}"
      register: target_key_check

    - name: Validate transferred repository key
      ansible.builtin.assert:
        that:
          - target_key_check.stat.exists
          - target_key_check.stat.size | int > 0
        fail_msg: "Uyuni repository key transfer failed."

    - name: Configure Uyuni Ubuntu 24.04 repository
      ansible.builtin.copy:
        dest: "{{ target_repo_file }}"
        content: |
          deb [arch=amd64 signed-by={{ target_keyring_file }}] {{ uyuni_repo_url }}/ ./
        owner: root
        group: root
        mode: "0644"

    - name: Update APT package indexes
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
        lock_timeout: 300

    - name: Install Uyuni Salt Minion
      ansible.builtin.apt:
        name: venv-salt-minion
        state: present
        update_cache: false
        lock_timeout: 300

    - name: Create Uyuni minion configuration directory
      ansible.builtin.file:
        path: /etc/venv-salt-minion/minion.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure Uyuni Salt Minion
      ansible.builtin.copy:
        dest: /etc/venv-salt-minion/minion.d/uyuni.conf
        content: |
          master: {{ uyuni_master }}
          server_id_use_crc: adler32
          enable_legacy_startup_events: False
          enable_fqdns_grains: False

          grains:
            susemanager:
              activation_key: "{{ uyuni_activation_key }}"
        owner: root
        group: root
        mode: "0640"
      no_log: true

    - name: Enable and restart Uyuni Salt Minion
      ansible.builtin.systemd:
        name: venv-salt-minion
        enabled: true
        state: restarted

    - name: Verify Uyuni Salt Minion package
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - "-f=${Status}"
          - venv-salt-minion
      register: package_status
      changed_when: false
      failed_when: package_status.stdout | trim != "install ok installed"

    - name: Verify Uyuni Salt Minion service
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - venv-salt-minion
      register: service_status
      changed_when: false
      failed_when: service_status.stdout | trim != "active"

    - name: Display final installation result
      ansible.builtin.debug:
        msg:
          - "UYUNI CLIENT INSTALLATION SUCCESSFUL"
          - "Client: {{ inventory_hostname }}"
          - "Operating System: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "Package: {{ package_status.stdout | trim }}"
          - "Service: {{ service_status.stdout | trim }}"
          - "Uyuni Master: {{ uyuni_master }}"
          - "Activation Key: {{ uyuni_activation_key }}"
