
---
- name: Offline Install and Configure Uyuni Client
  hosts: all
  become: true
  gather_facts: false

  vars:
    target_staging_dir: "/root/uyuni_offline"
    uyuni_master: "uyuni.1point1.in"

  pre_tasks:

    - name: Find offline DEB packages in AWX project directory
      ansible.builtin.find:
        paths: "{{ playbook_dir }}"
        patterns: "*.deb"
        file_type: file
        recurse: false
      delegate_to: localhost
      become: false
      register: offline_deb_files

    - name: Validate offline package availability
      ansible.builtin.assert:
        that:
          - offline_deb_files.matched | int > 0
        fail_msg: >-
          No DEB packages found in AWX project directory:
          {{ playbook_dir }}

    - name: Display package count available on AWX
      ansible.builtin.debug:
        msg: "Found {{ offline_deb_files.matched }} offline DEB packages on AWX."

  tasks:

    - name: Create package staging directory on target
      ansible.builtin.file:
        path: "{{ target_staging_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Transfer offline DEB packages from AWX to target
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ target_staging_dir }}/{{ item.path | basename }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ offline_deb_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Find transferred DEB packages on target
      ansible.builtin.find:
        paths: "{{ target_staging_dir }}"
        patterns: "*.deb"
        file_type: file
        recurse: false
      register: transferred_deb_files

    - name: Validate package transfer
      ansible.builtin.assert:
        that:
          - transferred_deb_files.matched | int == offline_deb_files.matched | int
        fail_msg: "Package transfer verification failed."

    - name: Display successful package transfer
      ansible.builtin.debug:
        msg:
          - "AWX packages: {{ offline_deb_files.matched }}"
          - "Target packages: {{ transferred_deb_files.matched }}"
          - "Target directory: {{ target_staging_dir }}"

    - name: Install all offline DEB packages on target
      ansible.builtin.command:
        argv: "{{ ['dpkg', '-i'] + (transferred_deb_files.files | map(attribute='path') | list) }}"
      register: dpkg_install
      changed_when: dpkg_install.rc == 0

    - name: Ensure Uyuni minion configuration directory exists
      ansible.builtin.file:
        path: /etc/venv-salt-minion/minion.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy Uyuni minion configuration
      ansible.builtin.copy:
        dest: /etc/venv-salt-minion/minion.d/uyuni.conf
        content: |
          master: {{ uyuni_master }}
          server_id_use_crc: adler32
          enable_legacy_startup_events: False
          enable_fqdns_grains: False

          grains:
            susemanager:
              activation_key: "{{ uyuni_activation_key }}"
        owner: root
        group: root
        mode: '0640'
      no_log: true

    - name: Enable and start venv-salt-minion
      ansible.builtin.systemd:
        name: venv-salt-minion
        state: started
        enabled: true

    - name: Verify venv-salt-minion service
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - venv-salt-minion
      register: minion_status
      changed_when: false
      failed_when: minion_status.stdout != "active"

    - name: Display final installation result
      ansible.builtin.debug:
        msg:
          - "Uyuni client installation completed successfully."
          - "Transferred packages: {{ transferred_deb_files.matched }}"
          - "Installation location: {{ target_staging_dir }}"
          - "Minion service: {{ minion_status.stdout }}"
