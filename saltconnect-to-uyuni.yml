
---
- name: Offline Install and Configure Uyuni Client
  hosts: all
  become: true
  gather_facts: false

  vars:
    controller_deb_dir: "{{ playbook_dir }}"
    target_staging_dir: "/root/uyuni_offline"

  pre_tasks:

    - name: Find DEB packages in AWX project root
      ansible.builtin.find:
        paths: "{{ controller_deb_dir }}"
        patterns: "*.deb"
        file_type: file
        recurse: false
      delegate_to: localhost
      become: false
      register: offline_deb_files

    - name: Verify that DEB packages exist
      ansible.builtin.assert:
        that:
          - offline_deb_files.matched | int > 0
        fail_msg: >-
          No DEB packages were found in the AWX project root:
          {{ controller_deb_dir }}

    - name: Display number of packages found
      ansible.builtin.debug:
        msg: "Found {{ offline_deb_files.matched }} DEB packages."

  tasks:

    - name: Create package directory under target root
      ansible.builtin.file:
        path: "{{ target_staging_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Transfer offline DEB packages to target root
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ target_staging_dir }}/{{ item.path | basename }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ offline_deb_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Verify transferred DEB packages
      ansible.builtin.find:
        paths: "{{ target_staging_dir }}"
        patterns: "*.deb"
        file_type: file
        recurse: false
      register: transferred_packages

    - name: Validate package transfer count
      ansible.builtin.assert:
        that:
          - transferred_packages.matched | int == offline_deb_files.matched | int
        fail_msg: >-
          Package transfer verification failed.
          Expected {{ offline_deb_files.matched }} packages,
          found {{ transferred_packages.matched }} packages.

    - name: Display successful package transfer
      ansible.builtin.debug:
        msg: >-
          Successfully transferred {{ transferred_packages.matched }}
          DEB packages to {{ target_staging_dir }}.

    - name: Install offline DEB packages
      ansible.builtin.shell: |
        set -e
        shopt -s nullglob
        packages=( {{ target_staging_dir }}/*.deb )

        if [ ${#packages[@]} -eq 0 ]; then
          echo "ERROR: No DEB packages found."
          exit 1
        fi

        dpkg -i "${packages[@]}"
      args:
        executable: /bin/bash
      register: dpkg_install
      changed_when: dpkg_install.rc == 0

    - name: Ensure Uyuni minion configuration directory exists
      ansible.builtin.file:
        path: /etc/venv-salt-minion/minion.d
        state: directory
        mode: '0755'

    - name: Configure Uyuni Salt Minion
      ansible.builtin.copy:
        dest: /etc/venv-salt-minion/minion.d/uyuni.conf
        content: |
          master: uyuni.1point1.in
          server_id_use_crc: adler32
          enable_legacy_startup_events: False
          enable_fqdns_grains: False

          grains:
            susemanager:
              activation_key: "{{ uyuni_activation_key }}"
        owner: root
        group: root
        mode: '0640'
      no_log: true

    - name: Enable and start Uyuni Salt Minion
      ansible.builtin.systemd:
        name: venv-salt-minion
        enabled: true
        state: started

    - name: Verify Uyuni Salt Minion service
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - venv-salt-minion
      register: minion_service
      changed_when: false
      failed_when: minion_service.stdout != "active"

    - name: Display installation result
      ansible.builtin.debug:
        msg:
          - "Uyuni client installation completed."
          - "Packages transferred: {{ transferred_packages.matched }}"
          - "Installation directory: {{ target_staging_dir }}"
          - "Minion service: {{ minion_service.stdout }}"
