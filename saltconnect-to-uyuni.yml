---
- name: Offline Install and Configure Uyuni Client
  hosts: all
  become: true
  gather_facts: false

  vars:
    target_staging_dir: "/tmp/uyuni_offline"

  tasks:
    - name: Create temporary staging directory on target hosts
      ansible.builtin.file:
        path: "{{ target_staging_dir }}"
        state: directory
        mode: '0755'

    - name: Copy offline .deb packages from project to target hosts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/"
        dest: "{{ target_staging_dir }}/"
        mode: '0644'

    - name: Install venv-salt-minion packages offline
      ansible.builtin.shell: |
        dpkg -i {{ target_staging_dir }}/*.deb
      args:
        executable: /bin/bash
      register: dpkg_install
      changed_when: "'Setting up venv-salt-minion' in dpkg_install.stdout"

    - name: Ensure /etc/venv-salt-minion/minion.d directory exists
      ansible.builtin.file:
        path: /etc/venv-salt-minion/minion.d
        state: directory
        mode: '0755'

    - name: Deploy Uyuni minion configuration
      ansible.builtin.copy:
        dest: /etc/venv-salt-minion/minion.d/uyuni.conf
        content: |
          master: uyuni.1point1.in
          server_id_use_crc: adler32
          enable_legacy_startup_events: False
          enable_fqdns_grains: False

          grains:
            susemanager:
              activation_key: "1-333f40a929544534b88f430ac55db6c4"
        mode: '0640'

    - name: Enable and start venv-salt-minion service
      ansible.builtin.systemd:
        name: venv-salt-minion
        state: started
        enabled: true

    - name: Clean up temporary .deb staging files on target
      ansible.builtin.file:
        path: "{{ target_staging_dir }}"
        state: absent
