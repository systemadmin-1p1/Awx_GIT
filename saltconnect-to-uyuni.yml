
---
# ============================================================
# PLAY 1: DOWNLOAD OFFLINE PACKAGES ON AWX EXECUTION ENVIRONMENT
# ============================================================

- name: Download Uyuni Salt Minion packages on AWX
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    awx_package_dir: "/tmp/uyuni_offline"

    # Replace these example URLs with the actual downloadable
    # package URLs for your Ubuntu 24.04 / Linux Lite 7.8 client.
    # Add every required dependency to this list.

    uyuni_deb_packages:
      - filename: "venv-salt-minion_VERSION.deb"
        url: "https://YOUR-PACKAGE-SERVER/venv-salt-minion_VERSION.deb"

      - filename: "DEPENDENCY-01_VERSION.deb"
        url: "https://YOUR-PACKAGE-SERVER/DEPENDENCY-01_VERSION.deb"

      - filename: "DEPENDENCY-02_VERSION.deb"
        url: "https://YOUR-PACKAGE-SERVER/DEPENDENCY-02_VERSION.deb"

  tasks:

    - name: Validate package download definitions
      ansible.builtin.assert:
        that:
          - item.filename is match('^[A-Za-z0-9._+~-]+[.]deb$')
          - item.url is match('^https?://')
          - "'YOUR-PACKAGE-SERVER' not in item.url"
        fail_msg: "Invalid package filename or download URL: {{ item.filename }}"
      loop: "{{ uyuni_deb_packages }}"
      loop_control:
        label: "{{ item.filename }}"

    - name: Create package directory on AWX execution environment
      ansible.builtin.file:
        path: "{{ awx_package_dir }}"
        state: directory
        mode: "0755"

    - name: Make package information available to target play
      ansible.builtin.set_fact:
        uyuni_awx_package_dir: "{{ awx_package_dir }}"
        uyuni_deb_package_manifest: "{{ uyuni_deb_packages }}"

    - name: Download offline DEB packages on AWX
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ awx_package_dir }}/{{ item.filename }}"
        mode: "0644"
        validate_certs: true
      loop: "{{ uyuni_deb_packages }}"
      loop_control:
        label: "{{ item.filename }}"

    - name: Verify downloaded packages on AWX
      ansible.builtin.stat:
        path: "{{ awx_package_dir }}/{{ item.filename }}"
      loop: "{{ uyuni_deb_packages }}"
      loop_control:
        label: "{{ item.filename }}"
      register: awx_package_checks

    - name: Validate downloaded package files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size | int > 0
        fail_msg: "Package download missing or empty: {{ item.item.filename }}"
      loop: "{{ awx_package_checks.results }}"
      loop_control:
        label: "{{ item.item.filename }}"

    - name: Display AWX download summary
      ansible.builtin.debug:
        msg:
          - "AWX package download completed successfully."
          - "Packages downloaded: {{ uyuni_deb_packages | length }}"
          - "AWX package directory: {{ awx_package_dir }}"


# ============================================================
# PLAY 2: TRANSFER AND INSTALL ON TARGET LINUX CLIENTS
# ============================================================

- name: Transfer and install Uyuni Salt Minion on clients
  hosts: "all:!localhost"
  gather_facts: false
  become: false
  serial: 5

  vars:
    target_staging_dir: "/root/uyuni_offline"
    uyuni_master: "uyuni.1point1.in"
    cleanup_target_packages: true

  pre_tasks:

    - name: Check SSH and Python connectivity
      ansible.builtin.ping:
      changed_when: false

    - name: Verify target supports Debian package installation
      ansible.builtin.command:
        argv:
          - dpkg
          - --version
      register: dpkg_check
      changed_when: false
      failed_when: dpkg_check.rc != 0

    - name: Verify AWX package manifest is available
      ansible.builtin.assert:
        that:
          - hostvars['localhost']['uyuni_deb_package_manifest'] is defined
          - hostvars['localhost']['uyuni_deb_package_manifest'] | length > 0
          - hostvars['localhost']['uyuni_awx_package_dir'] is defined
        fail_msg: "AWX package download information is missing."

  tasks:

    - name: Create package directory on target client
      ansible.builtin.file:
        path: "{{ target_staging_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      become: true

    - name: Transfer offline DEB packages from AWX to target
      ansible.builtin.copy:
        src: "{{ hostvars['localhost']['uyuni_awx_package_dir'] }}/{{ item.filename }}"
        dest: "{{ target_staging_dir }}/{{ item.filename }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ hostvars['localhost']['uyuni_deb_package_manifest'] }}"
      loop_control:
        label: "{{ item.filename }}"
      become: true

    - name: Verify transferred DEB packages on target
      ansible.builtin.stat:
        path: "{{ target_staging_dir }}/{{ item.filename }}"
      loop: "{{ hostvars['localhost']['uyuni_deb_package_manifest'] }}"
      loop_control:
        label: "{{ item.filename }}"
      register: target_package_checks
      become: true

    - name: Validate target package files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size | int > 0
        fail_msg: "Package transfer failed: {{ item.item.filename }}"
      loop: "{{ target_package_checks.results }}"
      loop_control:
        label: "{{ item.item.filename }}"

    - name: Display successful package transfer
      ansible.builtin.debug:
        msg:
          - "Target: {{ inventory_hostname }}"
          - "Packages transferred: {{ target_package_checks.results | length }}"
          - "Package location: {{ target_staging_dir }}"

    - name: Install all offline DEB packages on target
      ansible.builtin.command:
        argv: "{{ ['/usr/bin/dpkg', '-i'] + (target_package_checks.results | map(attribute='stat.path') | list) }}"
      register: dpkg_install
      changed_when: dpkg_install.rc == 0
      become: true

    - name: Ensure Uyuni minion configuration directory exists
      ansible.builtin.file:
        path: /etc/venv-salt-minion/minion.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Deploy Uyuni minion configuration
      ansible.builtin.copy:
        dest: /etc/venv-salt-minion/minion.d/uyuni.conf
        content: |
          master: {{ uyuni_master }}
          server_id_use_crc: adler32
          enable_legacy_startup_events: False
          enable_fqdns_grains: False

          grains:
            susemanager:
              activation_key: "{{ uyuni_activation_key }}"
        owner: root
        group: root
        mode: "0640"
      no_log: true
      become: true

    - name: Enable and start Uyuni Salt Minion
      ansible.builtin.systemd:
        name: venv-salt-minion
        state: started
        enabled: true
      become: true

    - name: Verify Uyuni Salt Minion service
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - venv-salt-minion
      register: minion_status
      changed_when: false
      failed_when: minion_status.stdout | trim != "active"
      become: true

    - name: Clean transferred DEB packages after successful installation
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        state: absent
      loop: "{{ target_package_checks.results }}"
      loop_control:
        label: "{{ item.item.filename }}"
      when: cleanup_target_packages | bool
      become: true

    - name: Display final installation result
      ansible.builtin.debug:
        msg:
          - "SUCCESS: Uyuni client installation completed."
          - "Target: {{ inventory_hostname }}"
          - "Packages installed: {{ target_package_checks.results | length }}"
          - "Minion service: {{ minion_status.stdout | trim }}"
