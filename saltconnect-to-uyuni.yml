# 1. Download the repository trust key safely
sudo mkdir -p /etc/apt/keyrings
curl -fsSL https://download.opensuse.org/repositories/systemsmanagement:/Uyuni:/Master:/Ubuntu2404-Uyuni-Client-Tools/xUbuntu_24.04/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/uyuni-client-tools.gpg

# 2. Map out the sources file (signed by the key above)
echo 'deb [signed-by=/etc/apt/keyrings/uyuni-client-tools.gpg] http://download.opensuse.org/repositories/systemsmanagement:/Uyuni:/Master:/Ubuntu2404-Uyuni-Client-Tools/xUbuntu_24.04/ /' | sudo tee /etc/apt/sources.list.d/uyuni-client-tools.list



sudo apt-get update

sudo apt-get install -y venv-salt-minion

sudo mkdir -p /etc/venv-salt-minion/minion.d/
sudo nano /etc/venv-salt-minion/minion.d/uyuni.conf

