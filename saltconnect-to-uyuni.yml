---
- name: Install and Configure Uyuni Client
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Ensure /etc/apt/keyrings directory exists on targets
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # Download and prepare key on the Ansible controller
    - name: Download Uyuni repository Release key on control node
      ansible.builtin.get_url:
        url: "https://download.opensuse.org/repositories/systemsmanagement:/Uyuni:/Master:/Ubuntu2404-Uyuni-Client-Tools/xUbuntu_24.04/Release.key"
        dest: /tmp/uyuni-release.key
        mode: '0644'
      delegate_to: localhost
      run_once: true
      become: false

    - name: Dearmor GPG key on control node
      ansible.builtin.command:
        cmd: gpg --dearmor --yes -o /tmp/uyuni-client-tools.gpg /tmp/uyuni-release.key
      delegate_to: localhost
      run_once: true
      become: false

    # Push the ready key to target machines
    - name: Copy dearmored GPG key to target hosts
      ansible.builtin.copy:
        src: /tmp/uyuni-client-tools.gpg
        dest: /etc/apt/keyrings/uyuni-client-tools.gpg
        mode: '0644'

    - name: Add Uyuni client tools APT repository source
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/uyuni-client-tools.list
        content: |
          deb [signed-by=/etc/apt/keyrings/uyuni-client-tools.gpg] http://download.opensuse.org/repositories/systemsmanagement:/Uyuni:/Master:/Ubuntu2404-Uyuni-Client-Tools/xUbuntu_24.04/ /
        mode: '0644'

    - name: Update apt cache and install venv-salt-minion
      ansible.builtin.apt:
        name: venv-salt-minion
        state: present
        update_cache: true

    - name: Ensure /etc/venv-salt-minion/minion.d directory exists
      ansible.builtin.file:
        path: /etc/venv-salt-minion/minion.d
        state: directory
        mode: '0755'

    - name: Configure Uyuni minion settings
      ansible.builtin.copy:
        dest: /etc/venv-salt-minion/minion.d/uyuni.conf
        content: |
          master: uyuni.1point1.in
          server_id_use_crc: adler32
          enable_legacy_startup_events: False
          enable_fqdns_grains: False

          grains:
            susemanager:
              activation_key: "1-333f40a929544534b88f430ac55db6c4"
        mode: '0640'

    - name: Enable and start venv-salt-minion service
      ansible.builtin.systemd:
        name: venv-salt-minion
        state: started
        enabled: true
