---
- name: Install WPS Office from GitHub Release
  hosts: all
  become: true
  become_method: sudo
  gather_facts: false

  vars:
    # 1. Update this to your direct GitHub Release download URL
    # Format: https://github.com/<OWNER>/<REPO>/releases/download/<TAG>/wps-office_<VERSION>_amd64.deb
    github_deb_url: "https://github.com/your-org/your-repo/releases/download/v1.0.0/wps-office_11.1.0.11733.XA_amd64.deb"
    
    # Optional: If your GitHub repo is private, supply a Personal Access Token (PAT)
    # github_token: "ghp_xxxxxxxxxxxxxxxxxxxx"

    temp_deb_path: "/tmp/wps-office.deb"
    logged_in_user: "{{ ansible_user | default('ubuntu') }}"

  tasks:

    # --- 1. Prevent Lock Contention ---
    - name: Stop Puppet and APT background services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - puppet
        - apt-daily.service
        - apt-daily-upgrade.service
        - apt-daily.timer
        - apt-daily-upgrade.timer
      failed_when: false

    - name: Wait for any active dpkg/apt locks to release
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 2
        done
      changed_when: false
      timeout: 60
      failed_when: false

    # --- 2. Check & Install WPS ---
    - block:

        - name: Check if WPS Office is already installed
          ansible.builtin.command:
            cmd: dpkg-query -W -f='${Status}' wps-office
          register: wps_installed
          changed_when: false
          failed_when: false

        - name: Download and install WPS Office
          when: "'install ok installed' not in wps_installed.stdout"
          block:

            - name: Download DEB directly from GitHub Release
              ansible.builtin.get_url:
                url: "{{ github_deb_url }}"
                dest: "{{ temp_deb_path }}"
                mode: "0644"
                timeout: 300
                # Uncomment the headers block below if the GitHub repository is private:
                # headers:
                #   Authorization: "Bearer {{ github_token }}"
                #   Accept: "application/octet-stream"

            - name: Install WPS Office deb package
              ansible.builtin.apt:
                deb: "{{ temp_deb_path }}"
                state: present
              ignore_errors: true
              register: deb_result

            - name: Resolve missing shared libraries/dependencies
              ansible.builtin.command:
                cmd: apt-get -f install -y
              environment:
                DEBIAN_FRONTEND: noninteractive
              when: deb_result is failed

          always:

            - name: Clean up temporary installer deb file
              ansible.builtin.file:
                path: "{{ temp_deb_path }}"
                state: absent

        # --- 3. Place Desktop Shortcuts ---
        - name: Find WPS .desktop launch files
          ansible.builtin.find:
            paths: /usr/share/applications
            patterns: "*wps*.desktop"
          register: wps_desktop_entries

        - name: Ensure user Desktop directory exists
          ansible.builtin.file:
            path: "/home/{{ logged_in_user }}/Desktop"
            state: directory
            owner: "{{ logged_in_user }}"
            mode: "0755"

        - name: Copy WPS icons to user Desktop
          ansible.builtin.copy:
            src: "{{ item.path }}"
            dest: "/home/{{ logged_in_user }}/Desktop/{{ item.path | basename }}"
            remote_src: true
            owner: "{{ logged_in_user }}"
            mode: "0755"
          loop: "{{ wps_desktop_entries.files }}"

      always:

        - name: Ensure Puppet is restarted
          ansible.builtin.systemd:
            name: puppet
            state: started
            enabled: true



