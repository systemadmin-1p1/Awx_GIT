---
- name: Install WPS Office from GitHub Release
  hosts: all
  become: true
  become_method: sudo
  gather_facts: false
  # Prevents unreachable machines (like .97) from blocking or failing the rest of the batch
  ignore_unreachable: true

  vars:
    # Your exact GitHub Release download URL
    github_deb_url: "https://github.com/systemadmin-1p1/Awx_GIT/releases/download/wps-deb-11/wps-office_11.1.0.11733.XA_amd64.deb"
    github_token: "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"
    temp_deb_path: "/tmp/wps-office.deb"

  tasks:

    # --- 1. Clean Locks & Stop Background Updaters ---
    - name: Stop Puppet and APT background services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - puppet
        - apt-daily.service
        - apt-daily-upgrade.service
        - apt-daily.timer
        - apt-daily-upgrade.timer
      failed_when: false

    - name: Wait for any active dpkg/apt locks to release
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
              fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 2
        done
      changed_when: false
      timeout: 45
      failed_when: false

    # --- 2. Check, Fetch & Install WPS ---
    - block:

        - name: Check if WPS Office is already installed
          ansible.builtin.command:
            cmd: dpkg-query -W -f='${Status}' wps-office
          register: wps_installed
          changed_when: false
          failed_when: false

        - name: Download and install WPS Office
          when: "'install ok installed' not in wps_installed.stdout"
          block:

            - name: Download DEB from GitHub Release
              ansible.builtin.get_url:
                url: "{{ github_deb_url }}"
                dest: "{{ temp_deb_path }}"
                headers:
                  Authorization: "Bearer {{ github_token }}"
                  Accept: "application/octet-stream"
                mode: "0644"
                timeout: 300
                force: true

            - name: Install WPS Office deb package
              ansible.builtin.apt:
                deb: "{{ temp_deb_path }}"
                state: present
              ignore_errors: true
              register: deb_result

            - name: Resolve missing shared libraries/dependencies
              ansible.builtin.command:
                cmd: apt-get -f install -y
              environment:
                DEBIAN_FRONTEND: noninteractive
              when: deb_result is failed

          always:

            - name: Clean up temporary installer deb file
              ansible.builtin.file:
                path: "{{ temp_deb_path }}"
                state: absent

        # --- 3. Place Desktop Shortcuts ---
        - name: Find WPS .desktop launch files
          ansible.builtin.find:
            paths: /usr/share/applications
            patterns: "*wps*.desktop"
          register: wps_desktop_entries

        - name: Identify active user desktop folders
          ansible.builtin.find:
            paths: /home
            file_type: directory
            recurse: false
          register: user_home_dirs

        - name: Copy WPS icons to each user's Desktop
          ansible.builtin.copy:
            src: "{{ item.0.path }}"
            dest: "{{ item.1.path }}/Desktop/{{ item.0.path | basename }}"
            remote_src: true
            mode: "0755"
          loop: "{{ wps_desktop_entries.files | product(user_home_dirs.files) | list }}"
          failed_when: false

      always:

        - name: Ensure Puppet is restarted
          ansible.builtin.systemd:
            name: puppet
            state: started
            enabled: true

