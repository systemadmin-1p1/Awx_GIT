---
- name: Download WPS Office package in AWX
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    wps_url: "https://github.com/systemadmin-1p1/Awx_GIT/releases/download/wps-deb-11/wps-office_11.1.0.11733.XA_amd64.deb"
    wps_file: "/tmp/wps-office_11.1.0.11733.XA_amd64.deb"

  tasks:

    - name: Download WPS DEB to AWX
      ansible.builtin.get_url:
        url: "{{ wps_url }}"
        dest: "{{ wps_file }}"
        mode: "0644"
        headers:
          Authorization: "Bearer {{ github_token }}"
      no_log: true


- name: Install WPS Office on desktops
  hosts: all
  become: true
  become_method: sudo
  gather_facts: false

  vars:
    wps_file: "/tmp/wps-office_11.1.0.11733.XA_amd64.deb"
    remote_wps_file: "/tmp/wps-office_11.1.0.11733.XA_amd64.deb"

  tasks:

    - name: Stop Puppet
      ansible.builtin.systemd:
        name: puppet
        state: stopped

    - block:

        - name: Check if WPS is already installed
          ansible.builtin.shell: |
            dpkg -l | grep -i '^ii  wps'
          register: wps_check
          changed_when: false
          failed_when: false

        - name: Copy WPS DEB from AWX to desktop
          ansible.builtin.copy:
            src: "{{ wps_file }}"
            dest: "{{ remote_wps_file }}"
            mode: "0644"
          when: wps_check.rc != 0

        - name: Install WPS Office
          ansible.builtin.apt:
            deb: "{{ remote_wps_file }}"
          when: wps_check.rc != 0

        - name: Remove WPS DEB from desktop
          ansible.builtin.file:
            path: "{{ remote_wps_file }}"
            state: absent

      always:

        - name: Start Puppet
          ansible.builtin.systemd:
            name: puppet
            state: started
            enabled: true


- name: Cleanup WPS package from AWX
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    wps_file: "/tmp/wps-office_11.1.0.11733.XA_amd64.deb"

  tasks:

    - name: Remove WPS DEB from AWX
      ansible.builtin.file:
        path: "{{ wps_file }}"
        state: absent
