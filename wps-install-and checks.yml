---
- name: Install WPS Office
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Stop Puppet
      ansible.builtin.systemd:
        name: puppet
        state: stopped

    - name: Remove proxy variables
      ansible.builtin.shell: |
        sed -i '/^http_proxy=/d' /etc/environment
        sed -i '/^https_proxy=/d' /etc/environment
        sed -i '/^ftp_proxy=/d' /etc/environment
        sed -i '/^HTTP_PROXY=/d' /etc/environment
        sed -i '/^HTTPS_PROXY=/d' /etc/environment
        sed -i '/^FTP_PROXY=/d' /etc/environment
      changed_when: true

    - name: Remove APT proxy
      ansible.builtin.file:
        path: /etc/apt/apt.conf.d/80proxy
        state: absent

    - name: Install snapd
      ansible.builtin.apt:
        name: snapd
        state: present
        update_cache: true

    - name: Start snapd
      ansible.builtin.systemd:
        name: snapd
        state: started
        enabled: true

    - name: Wait for snapd
      ansible.builtin.command:
        cmd: snap version
      register: snap_version
      retries: 10
      delay: 5
      until: snap_version.rc == 0
      changed_when: false

    - name: Install WPS Office
      ansible.builtin.command:
        cmd: snap install wps-2019-snap

    - name: Start Puppet
      ansible.builtin.systemd:
        name: puppet
        state: started
        enabled: true
