---
- name: Inspect AWX job project storage
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Inspect project paths
      ansible.builtin.shell: |
        echo "PWD=$PWD"
        echo "HOME=$HOME"
        echo
        echo "=== /runner ==="
        ls -lah /runner
        echo
        echo "=== /runner/project ==="
        ls -lah /runner/project
        echo
        echo "=== mounts ==="
        mount 2>/dev/null | grep -E 'runner|project|awx' || true
        echo
        echo "=== disk ==="
        df -h
      register: result
      changed_when: false

    - name: Display
      ansible.builtin.debug:
        var: result.stdout_lines
