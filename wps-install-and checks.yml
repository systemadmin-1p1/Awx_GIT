---
- name: Test AWX job container
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Show hostname
      ansible.builtin.command:
        cmd: hostname
      register: hostname_result
      changed_when: false

    - name: Keep job alive
      ansible.builtin.command:
        cmd: sleep 15
      changed_when: false

    - name: Show hostname
      ansible.builtin.debug:
        var: hostname_result.stdout
