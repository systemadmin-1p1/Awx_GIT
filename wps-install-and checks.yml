---
- name: Install WPS Office
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Stop Puppet
      ansible.builtin.systemd:
        name: puppet
        state: stopped

    - name: Remove proxy from environment
      ansible.builtin.shell: |
        sed -i -E '/^[[:space:]]*(http_proxy|https_proxy|ftp_proxy|HTTP_PROXY|HTTPS_PROXY|FTP_PROXY|ALL_PROXY|all_proxy)=/d' /etc/environment
      changed_when: true

    - name: Remove APT proxy configuration
      ansible.builtin.file:
        path: /etc/apt/apt.conf.d/80proxy
        state: absent

    - name: Remove old snapd proxy configuration
      ansible.builtin.file:
        path: /etc/systemd/system/snapd.service.d/proxy.conf
        state: absent

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - block:
        - name: Check snapd installation
          ansible.builtin.command:
            cmd: dpkg-query -W -f='${Status}' snapd
          register: snapd_check
          changed_when: false
          failed_when: false

        - name: Install snapd
          ansible.builtin.apt:
            name: snapd
            state: present
            update_cache: true
          when: "'install ok installed' not in snapd_check.stdout"
          environment:
            http_proxy: ""
            https_proxy: ""
            ftp_proxy: ""
            HTTP_PROXY: ""
            HTTPS_PROXY: ""
            FTP_PROXY: ""
            ALL_PROXY: ""
            all_proxy: ""

        - name: Start snapd
          ansible.builtin.systemd:
            name: snapd
            state: started
            enabled: true

        - name: Start snapd socket
          ansible.builtin.systemd:
            name: snapd.socket
            state: started
            enabled: true

        - name: Wait for snapd
          ansible.builtin.command:
            cmd: snap version
          register: snap_version
          retries: 12
          delay: 5
          until: snap_version.rc == 0
          changed_when: false

        - name: Check WPS installation
          ansible.builtin.command:
            cmd: snap list wps-office-multilang
          register: wps_check
          changed_when: false
          failed_when: false

        - name: Install WPS Office
          ansible.builtin.command:
            cmd: snap install wps-office-multilang
          when: wps_check.rc != 0
          environment:
            http_proxy: ""
            https_proxy: ""
            ftp_proxy: ""
            HTTP_PROXY: ""
            HTTPS_PROXY: ""
            FTP_PROXY: ""
            ALL_PROXY: ""
            all_proxy: ""

        # --- CLI Fix: Expose direct commands (wps, et, wpp) into standard PATH ---
        - name: Symlink WPS CLI executables to /usr/local/bin
          ansible.builtin.file:
            src: "/snap/bin/wps-office-multilang.{{ item.src }}"
            dest: "/usr/local/bin/{{ item.dest }}"
            state: link
            force: true
          loop:
            - { src: "wps", dest: "wps" }
            - { src: "et", dest: "et" }
            - { src: "wpp", dest: "wpp" }

        # --- GUI Fix: Force desktop menu integration ---
        - name: Find WPS snap desktop files
          ansible.builtin.find:
            paths: /var/lib/snapd/desktop/applications
            patterns: "*wps*.desktop"
          register: wps_desktop_files

        - name: Symlink desktop entries to /usr/share/applications
          ansible.builtin.file:
            src: "{{ item.path }}"
            dest: "/usr/share/applications/{{ item.path | basename }}"
            state: link
            force: true
          loop: "{{ wps_desktop_files.files }}"

        - name: Update desktop database
          ansible.builtin.command:
            cmd: update-desktop-database /usr/share/applications
          changed_when: false
          failed_when: false

      always:
        - name: Start Puppet
          ansible.builtin.systemd:
            name: puppet
            state: started
            enabled: true
