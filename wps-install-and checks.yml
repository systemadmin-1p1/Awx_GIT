---
- name: Test WPS storage
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: List WPS storage
      ansible.builtin.command:
        cmd: ls -lh /opt/awx-storage/wps/
      register: wps_files
      changed_when: false

    - name: Show WPS storage
      ansible.builtin.debug:
        var: wps_files.stdout_lines
