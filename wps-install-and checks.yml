---
- name: Install WPS Office
  hosts: all
  become: true
  gather_facts: true

  tasks:

    - name: Unset all proxy variables
      ansible.builtin.shell: |
        unset http_proxy
        unset https_proxy
        unset ftp_proxy
        unset HTTP_PROXY
        unset HTTPS_PROXY
        unset FTP_PROXY
        unset ALL_PROXY
        unset all_proxy
      changed_when: false

    - name: Remove proxy variables from current Ansible environment
      ansible.builtin.set_fact:
        ansible_http_proxy: ""
        ansible_https_proxy: ""

    - name: Check direct Internet access
      ansible.builtin.command:
        cmd: curl -I -L --connect-timeout 10 https://api.snapcraft.io
      environment:
        http_proxy: ""
        https_proxy: ""
        ftp_proxy: ""
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        all_proxy: ""
      register: internet_test
      changed_when: false
      failed_when: false

    - name: Show Internet test
      ansible.builtin.debug:
        msg:
          - "Return code: {{ internet_test.rc }}"
          - "{{ internet_test.stdout_lines }}"

    - name: Update APT cache without proxy
      ansible.builtin.apt:
        update_cache: true
      environment:
        http_proxy: ""
        https_proxy: ""
        ftp_proxy: ""
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        all_proxy: ""

    - name: Install snapd without proxy
      ansible.builtin.apt:
        name: snapd
        state: present
      environment:
        http_proxy: ""
        https_proxy: ""
        ftp_proxy: ""
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        all_proxy: ""

    - name: Enable snapd
      ansible.builtin.systemd:
        name: snapd
        enabled: true
        state: started

    - name: Enable snapd socket
      ansible.builtin.systemd:
        name: snapd.socket
        enabled: true
        state: started

    - name: Wait for snapd
      ansible.builtin.command:
        cmd: snap version
      register: snap_version
      retries: 12
      delay: 5
      until: snap_version.rc == 0
      changed_when: false

    - name: Check WPS
      ansible.builtin.command:
        cmd: snap list wps-2019-snap
      register: wps_check
      changed_when: false
      failed_when: false

    - name: Install WPS Office without proxy
      ansible.builtin.command:
        cmd: snap install wps-2019-snap
      register: wps_install
      when: wps_check.rc != 0
      environment:
        http_proxy: ""
        https_proxy: ""
        ftp_proxy: ""
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        all_proxy: ""

    - name: Verify WPS
      ansible.builtin.command:
        cmd: snap list wps-2019-snap
      register: wps_verify
      changed_when: false
      failed_when: false

    - name: Final result
      ansible.builtin.debug:
        msg:
          - "SERVER: {{ inventory_hostname }}"
          - "SNAPD: {{ 'READY' if snap_version.rc == 0 else 'FAILED' }}"
          - "WPS: {{ 'INSTALLED' if wps_verify.rc == 0 else 'NOT INSTALLED' }}"
