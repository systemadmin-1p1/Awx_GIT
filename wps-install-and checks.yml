---
- name: Install WPS Office and Set as Default
  hosts: all
  become: yes
  tasks:
    - name: Download WPS deb on AWX runner
      ansible.builtin.get_url:
        url: "https://github.com/systemadmin-1p1/Awx_GIT/releases/download/wps-deb-11/wps-office_11.1.0.11733.XA_amd64.deb"
        dest: /tmp/wps-office.deb
      delegate_to: localhost
      run_once: true
      become: no

    - name: Transfer deb to target machine
      ansible.builtin.copy:
        src: /tmp/wps-office.deb
        dest: /tmp/wps-office.deb
        mode: '0644'

    - name: Unpack deb package
      ansible.builtin.command: dpkg --unpack /tmp/wps-office.deb

    - name: Comment out buggy chgrp command in postinst script
      ansible.builtin.replace:
        path: /var/lib/dpkg/info/wps-office.postinst
        regexp: '^(.*chgrp.*)$'
        replace: '# \1'

    - name: Complete package configuration
      ansible.builtin.command: dpkg --configure wps-office

    - name: Set WPS Office as default office suite system-wide
      ansible.builtin.copy:
        dest: /etc/xdg/mimeapps.list
        owner: root
        group: root
        mode: '0644'
        content: |
          [Default Applications]
          application/msword=wps-office-wps.desktop
          application/vnd.openxmlformats-officedocument.wordprocessingml.document=wps-office-wps.desktop
          application/vnd.ms-excel=wps-office-et.desktop
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet=wps-office-et.desktop
          application/vnd.ms-powerpoint=wps-office-wpp.desktop
          application/vnd.openxmlformats-officedocument.presentationml.presentation=wps-office-wpp.desktop
          application/pdf=wps-office-pdf.desktop

    - name: Clean up installer deb
      ansible.builtin.file:
        path: /tmp/wps-office.deb
        state: absent
