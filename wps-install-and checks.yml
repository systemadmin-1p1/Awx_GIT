---
- name: Install WPS Office from GitHub
  hosts: all
  become: true
  become_method: sudo
  gather_facts: false

  vars:
    wps_url: "https://github.com/systemadmin-1p1/Awx_GIT/releases/download/wps-deb-11/wps-office_11.1.0.11733.XA_amd64.deb"
    wps_deb: "/tmp/wps-office_11.1.0.11733.XA_amd64.deb"

  tasks:

    - name: Stop Puppet
      ansible.builtin.systemd:
        name: puppet
        state: stopped

    - block:

        - name: Remove proxy from environment
          ansible.builtin.shell: |
            sed -i -E '/^[[:space:]]*(http_proxy|https_proxy|ftp_proxy|HTTP_PROXY|HTTPS_PROXY|FTP_PROXY|ALL_PROXY|all_proxy)=/d' /etc/environment
          changed_when: true

        - name: Remove APT proxy configuration
          ansible.builtin.file:
            path: /etc/apt/apt.conf.d/80proxy
            state: absent

        - name: Download WPS Office DEB
          ansible.builtin.get_url:
            url: "{{ wps_url }}"
            dest: "{{ wps_deb }}"
            mode: "0644"
            headers:
              Authorization: "Bearer {{ github_token }}"
            force: true

        - name: Install WPS Office
          ansible.builtin.apt:
            deb: "{{ wps_deb }}"

        - name: Remove downloaded WPS package
          ansible.builtin.file:
            path: "{{ wps_deb }}"
            state: absent

      always:

        - name: Start Puppet
          ansible.builtin.systemd:
            name: puppet
            state: started
            enabled: true
