---
- name: Identify actual AWX execution environment
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Show environment
      ansible.builtin.shell: |
        echo "HOSTNAME=$HOSTNAME"
        echo "HOME=$HOME"
        echo "PWD=$PWD"
        echo "USER=$(whoami)"
        echo "CONTAINER:"
        cat /etc/hostname
        echo "FILESYSTEM:"
        ls -lah /
      register: result
      changed_when: false

    - name: Show result
      ansible.builtin.debug:
        var: result.stdout_lines
