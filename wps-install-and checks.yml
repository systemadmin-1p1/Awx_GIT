---
- name: Install WPS Office via Snap
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Ensure snapd is installed
      ansible.builtin.apt:
        name: snapd
        state: present

    - name: Ensure snapd service is enabled and running
      ansible.builtin.systemd:
        name: snapd
        enabled: yes
        state: started

    - name: Ensure snapd.socket is enabled and running
      ansible.builtin.systemd:
        name: snapd.socket
        enabled: yes
        state: started

    - name: Ensure /snap symlink exists
      ansible.builtin.file:
        src: /var/lib/snapd/snap
        dest: /snap
        state: link
        force: true

    - name: Wait for snap to become available
      ansible.builtin.command: snap version
      register: snap_ready
      retries: 10
      delay: 3
      until: snap_ready.rc == 0
      changed_when: false

    - name: Check if WPS Office is already installed
      ansible.builtin.command: snap list wps-office-multilang
      register: wps_installed
      failed_when: false
      changed_when: false

    - name: Install WPS Office
      ansible.builtin.command: snap install wps-office-multilang
      when: wps_installed.rc != 0
      register: wps_install

    - name: Display installation status
      ansible.builtin.debug:
        msg: >-
          {% if wps_installed.rc == 0 %}
          WPS Office is already installed. Skipping installation.
          {% else %}
          WPS Office installed successfully.
          {% endif %}
