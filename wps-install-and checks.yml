---
- name: Inspect AWX job storage
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Inspect runner and project
      ansible.builtin.shell: |
        echo "=== RUNNER ==="
        ls -lah /runner

        echo
        echo "=== PROJECT ==="
        ls -lah /runner/project

        echo
        echo "=== PROJECT FILES ==="
        find /runner/project -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

        echo
        echo "=== MOUNTS ==="
        cat /proc/mounts | grep -E '/runner|project|awx' || true

        echo
        echo "=== FILESYSTEM ==="
        df -h /runner /runner/project
      register: result
      changed_when: false

    - name: Display storage information
      ansible.builtin.debug:
        var: result.stdout_lines
