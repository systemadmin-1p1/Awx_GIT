---
- name: Install Snapd and WPS Office
  hosts: all
  become: true
  gather_facts: true

  tasks:

    # ---------------------------------------------------------
    # 1. Check OS
    # ---------------------------------------------------------
    - name: Display OS information
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Architecture: {{ ansible_architecture }}"

    # ---------------------------------------------------------
    # 2. Update APT cache
    # ---------------------------------------------------------
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when:
        - ansible_os_family == "Debian"

    # ---------------------------------------------------------
    # 3. Install snapd
    # ---------------------------------------------------------
    - name: Install snapd
      ansible.builtin.apt:
        name: snapd
        state: present
        update_cache: true
      when:
        - ansible_os_family == "Debian"

    # ---------------------------------------------------------
    # 4. Enable snapd service
    # ---------------------------------------------------------
    - name: Enable snapd service
      ansible.builtin.systemd:
        name: snapd.service
        enabled: true
        state: started
      when:
        - ansible_os_family == "Debian"
      failed_when: false

    # ---------------------------------------------------------
    # 5. Enable snapd socket
    # ---------------------------------------------------------
    - name: Enable snapd socket
      ansible.builtin.systemd:
        name: snapd.socket
        enabled: true
        state: started
      when:
        - ansible_os_family == "Debian"
      failed_when: false

    # ---------------------------------------------------------
    # 6. Check snap command
    # ---------------------------------------------------------
    - name: Check snap command
      ansible.builtin.command:
        cmd: snap --version
      register: snap_version
      changed_when: false
      failed_when: false

    - name: Display snap version
      ansible.builtin.debug:
        msg: "{{ snap_version.stdout }}"

    # ---------------------------------------------------------
    # 7. Wait for snapd to become ready
    # ---------------------------------------------------------
    - name: Wait for snapd to become ready
      ansible.builtin.command:
        cmd: snap version
      register: snap_ready
      retries: 10
      delay: 5
      until: snap_ready.rc == 0
      changed_when: false
      failed_when: false

    # ---------------------------------------------------------
    # 8. Check whether WPS is already installed
    # ---------------------------------------------------------
    - name: Check whether WPS Office is installed
      ansible.builtin.command:
        cmd: snap list wps-2019-snap
      register: wps_check
      changed_when: false
      failed_when: false

    # ---------------------------------------------------------
    # 9. Install WPS Office
    # ---------------------------------------------------------
    - name: Install WPS Office
      ansible.builtin.command:
        cmd: snap install wps-2019-snap
      register: wps_install
      when:
        - snap_ready.rc == 0
        - wps_check.rc != 0

    # ---------------------------------------------------------
    # 10. Verify WPS installation
    # ---------------------------------------------------------
    - name: Verify WPS Office installation
      ansible.builtin.command:
        cmd: snap list wps-2019-snap
      register: wps_verify
      changed_when: false
      failed_when: false

    # ---------------------------------------------------------
    # 11. Installation result
    # ---------------------------------------------------------
    - name: Display WPS installation result
      ansible.builtin.debug:
        msg: >-
          {% if wps_verify.rc == 0 %}
          WPS Office is installed successfully on {{ inventory_hostname }}.
          {% elif snap_ready.rc != 0 %}
          WPS Office installation failed because snapd is not ready on {{ inventory_hostname }}.
          {% else %}
          WPS Office installation could not be completed on {{ inventory_hostname }}.
          {% endif %}
