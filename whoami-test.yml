---
- name: Test GitHub Release Connectivity from AWX Runner
  hosts: all
  gather_facts: no
  tasks:
    - name: Test download with curl from AWX Execution Pod
      ansible.builtin.shell: |
        curl -ILs -m 15 -w "HTTP_STATUS:%{http_code}\nFINAL_URL:%{url_effective}\n" \
        "https://github.com/systemadmin-1p1/Awx_GIT/releases/download/wps-deb-11/wps-office_11.1.0.11733.XA_amd64.deb" \
        -o /dev/null
      delegate_to: localhost
      run_once: true
      register: curl_check
      failed_when: false

    - name: Display connection result
      ansible.builtin.debug:
        msg: "{{ curl_check.stdout_lines }}"
      delegate_to: localhost
      run_once: true
