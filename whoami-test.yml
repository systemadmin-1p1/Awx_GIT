---
- name: Fix RustDesk Installation and Configure Direct GUI Access
  hosts: all
  become: true
  gather_facts: true

  vars:
    rustdesk_user: "opoadmin"
    rustdesk_user_config: "/home/opoadmin/.config/rustdesk/RustDesk2.toml"
    rustdesk_root_config: "/root/.config/rustdesk/RustDesk2.toml"
    rustdesk_port: "21118"
    rustdesk_password: "Alb3rtp!nt0"
    # Maps system architecture to RustDesk deb package naming
    rustdesk_deb_arch: "{{ 'x86_64' if ansible_architecture == 'x86_64' else 'arm64' }}"
    rustdesk_deb_url: "https://github.com/rustdesk/rustdesk/releases/download/1.3.7/rustdesk-1.3.7-{{ rustdesk_deb_arch }}.deb"

  tasks:
    # 1. Diagnose the corrupted binary
    - name: Check existing binary format and architecture
      ansible.builtin.shell: |
        which rustdesk || true
        file $(which rustdesk 2>/dev/null) || true
      register: rustdesk_file_info
      changed_when: false

    - name: Display detected system architecture and binary info
      ansible.builtin.debug:
        msg:
          - "System Architecture: {{ ansible_architecture }}"
          - "Binary Info: {{ rustdesk_file_info.stdout_lines }}"

    # 2. Download and reinstall the correct package cleanly
    - name: Download matching RustDesk deb package
      ansible.builtin.get_url:
        url: "{{ rustdesk_deb_url }}"
        dest: "/tmp/rustdesk-correct.deb"
        mode: '0644'
        force: true

    - name: Install correct RustDesk package via APT
      ansible.builtin.apt:
        deb: "/tmp/rustdesk-correct.deb"
        state: present
      register: rustdesk_install

    - name: Verify newly installed binary can execute
      ansible.builtin.command:
        cmd: rustdesk --version
      register: rustdesk_version
      changed_when: false

    - name: Show verified RustDesk version
      ansible.builtin.debug:
        var: rustdesk_version.stdout

    # 3. Setup configuration directories and options
    - name: Ensure configuration directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "/home/{{ rustdesk_user }}/.config/rustdesk"
        - "/root/.config/rustdesk"

    - name: Ensure configuration files exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: touch
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: '0600'
        modification_time: preserve
        access_time: preserve
      loop:
        - { path: "{{ rustdesk_user_config }}", owner: "{{ rustdesk_user }}", group: "{{ rustdesk_user }}" }
        - { path: "{{ rustdesk_root_config }}", owner: "root", group: "root" }

    - name: Ensure [options] section header exists
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        line: "[options]"
        insertbefore: BOF
        state: present
      loop:
        - "{{ rustdesk_user_config }}"
        - "{{ rustdesk_root_config }}"

    - name: Configure Direct IP Access and verification method
      ansible.builtin.lineinfile:
        path: "{{ item.0 }}"
        regexp: "{{ item.1.regexp }}"
        line: "{{ item.1.line }}"
        insertafter: '^\[options\]'
        state: present
      loop: "{{ [rustdesk_user_config, rustdesk_root_config] | product([
          { 'regexp': '^direct-server[[:space:]]*=', 'line': \"direct-server = 'Y'\" },
          { 'regexp': '^direct-access-port[[:space:]]*=', 'line': \"direct-access-port = '\" ~ rustdesk_port ~ \"'\" },
          { 'regexp': '^verification-method[[:space:]]*=', 'line': \"verification-method = 'use-permanent-password'\" }
        ]) | list }}"

    - name: Set permanent password
      ansible.builtin.command:
        cmd: "rustdesk --password {{ rustdesk_password }}"
      changed_when: true
      no_log: true

    - name: Allow port {{ rustdesk_port }} in UFW if firewall is enabled
      ansible.builtin.shell: |
        if command -v ufw >/dev/null 2>&1 && ufw status | grep -q "Status: active"; then
          ufw allow {{ rustdesk_port }}/tcp
        fi
      changed_when: false

    # 4. Service restart and socket confirmation
    - name: Restart RustDesk system daemon
      ansible.builtin.systemd:
        name: rustdesk
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Wait for port binding
      ansible.builtin.pause:
        seconds: 4

    - name: Confirm port {{ rustdesk_port }} is actively listening
      ansible.builtin.shell: |
        ss -lntup | grep -E ':{{ rustdesk_port }}\b'
      register: final_ports
      changed_when: false
      failed_when: final_ports.stdout == ""

    - name: Display listening port confirmation
      ansible.builtin.debug:
        var: final_ports.stdout_lines
