---
- name: Download and Deploy WPS Office
  hosts: all
  become: yes
  vars:
    wps_url: "https://github.com/systemadmin-1p1/Awx_GIT/releases/download/wps-deb-11/wps-office_11.1.0.11733.XA_amd64.deb"
    local_pkg: "/tmp/wps-office.deb"
    remote_pkg: "/tmp/wps-office.deb"

  tasks:
    - name: Download WPS deb inside AWX runner pod
      ansible.builtin.get_url:
        url: "{{ wps_url }}"
        dest: "{{ local_pkg }}"
        timeout: 600
        mode: '0644'
      delegate_to: localhost
      run_once: true
      become: no

    - name: Push WPS deb from AWX pod to target desktop
      ansible.builtin.copy:
        src: "{{ local_pkg }}"
        dest: "{{ remote_pkg }}"
        mode: '0644'

    - name: Install WPS Office on target desktop
      ansible.builtin.apt:
        deb: "{{ remote_pkg }}"
        state: present

    - name: Clean up installer deb from target desktop
      ansible.builtin.file:
        path: "{{ remote_pkg }}"
        state: absent

    - name: Clean up installer deb from AWX runner pod
      ansible.builtin.file:
        path: "{{ local_pkg }}"
        state: absent
      delegate_to: localhost
      run_once: true
      become: no
