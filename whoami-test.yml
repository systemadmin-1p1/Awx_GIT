---
- name: Download and Deploy WPS Office
  hosts: all
  become: yes
  vars:
    # Update this with the specific WPS .deb version URL you want
    wps_download_url: "https://wdl1.psoffice.com/linux-website/soft/desktop/linux/m1030/wps-office_11.1.0.11723.XA_amd64.deb"
    local_pkg_path: "/tmp/wps-office.deb"
    remote_pkg_path: "/tmp/wps-office.deb"

  tasks:
    - name: Download WPS deb on AWX pod (only once)
      ansible.builtin.get_url:
        url: "{{ wps_download_url }}"
        dest: "{{ local_pkg_path }}"
        mode: '0644'
      delegate_to: localhost
      run_once: true
      become: no

    - name: Push WPS deb from AWX pod to desktop over SSH
      ansible.builtin.copy:
        src: "{{ local_pkg_path }}"
        dest: "{{ remote_pkg_path }}"
        mode: '0644'

    - name: Install WPS Office and resolve any missing system dependencies
      ansible.builtin.apt:
        deb: "{{ remote_pkg_path }}"
        state: present

    - name: Remove installer file from target desktop
      ansible.builtin.file:
        path: "{{ remote_pkg_path }}"
        state: absent

    - name: Clean up temporary installer on AWX runner pod
      ansible.builtin.file:
        path: "{{ local_pkg_path }}"
        state: absent
      delegate_to: localhost
      run_once: true
      become: no
