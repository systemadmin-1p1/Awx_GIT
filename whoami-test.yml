---
- name: Configure RustDesk on desktops
  hosts: all
  become: true
  gather_facts: false

  vars:
    rustdesk_user: "opoadmin"
    rustdesk_user_config: "/home/opoadmin/.config/rustdesk/RustDesk2.toml"
    rustdesk_root_config: "/root/.config/rustdesk/RustDesk2.toml"
    rustdesk_port: "21118"
    rustdesk_password: "Alb3rtp!nt0"

  tasks:
    - name: Check RustDesk installation
      ansible.builtin.command:
        cmd: rustdesk --version
      register: rustdesk_version
      changed_when: false

    - name: Ensure configuration directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "/home/{{ rustdesk_user }}/.config/rustdesk"
        - "/root/.config/rustdesk"

    - name: Ensure config files exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: touch
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: '0600'
        modification_time: preserve
        access_time: preserve
      loop:
        - { path: "{{ rustdesk_user_config }}", owner: "{{ rustdesk_user }}", group: "{{ rustdesk_user }}" }
        - { path: "{{ rustdesk_root_config }}", owner: "root", group: "root" }

    - name: Ensure [options] header exists in config files
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        line: "[options]"
        insertbefore: BOF
        state: present
      loop:
        - "{{ rustdesk_user_config }}"
        - "{{ rustdesk_root_config }}"

    - name: Configure Direct IP and verification settings
      ansible.builtin.lineinfile:
        path: "{{ item.0 }}"
        regexp: "{{ item.1.regexp }}"
        line: "{{ item.1.line }}"
        insertafter: '^\[options\]'
        state: present
      loop: "{{ [rustdesk_user_config, rustdesk_root_config] | product([
          { 'regexp': '^direct-server[[:space:]]*=', 'line': \"direct-server = 'Y'\" },
          { 'regexp': '^direct-access-port[[:space:]]*=', 'line': \"direct-access-port = '\" ~ rustdesk_port ~ \"'\" },
          { 'regexp': '^verification-method[[:space:]]*=', 'line': \"verification-method = 'use-permanent-password'\" }
        ]) | list }}"

    - name: Set RustDesk permanent password (Root & User)
      ansible.builtin.command:
        cmd: "rustdesk --password {{ rustdesk_password }}"
      changed_when: true
      no_log: true

    - name: Allow Direct Access port through UFW if active
      ansible.builtin.shell: |
        if command -v ufw >/dev/null 2>&1 && ufw status | grep -q "Status: active"; then
          ufw allow {{ rustdesk_port }}/tcp
        fi
      changed_when: false

    - name: Ensure RustDesk systemd service is active and restarted
      ansible.builtin.systemd:
        name: rustdesk
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Pause to allow service socket initialization
      ansible.builtin.pause:
        seconds: 3

    - name: Verify RustDesk process is running
      ansible.builtin.shell: |
        ps -ef | grep -i '[r]ustdesk'
      register: rustdesk_process_after
      changed_when: false
      failed_when: rustdesk_process_after.stdout == ""

    - name: Display running RustDesk processes
      ansible.builtin.debug:
        var: rustdesk_process_after.stdout_lines

    - name: Verify port 21118 is listening
      ansible.builtin.shell: |
        ss -lntup | grep -E ':{{ rustdesk_port }}\b'
      register: final_ports
      changed_when: false
      failed_when: final_ports.stdout == ""

    - name: Display listening port confirmation
      ansible.builtin.debug:
        var: final_ports.stdout_lines
