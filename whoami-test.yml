---
- name: Install WPS Office
  hosts: all
  become: yes
  tasks:
    - name: Download WPS deb on AWX
      ansible.builtin.get_url:
        url: "https://github.com/systemadmin-1p1/Awx_GIT/releases/download/wps-deb-11/wps-office_11.1.0.11733.XA_amd64.deb"
        dest: /tmp/wps-office.deb
      delegate_to: localhost
      run_once: true
      become: no

    - name: Transfer deb to target machine
      ansible.builtin.copy:
        src: /tmp/wps-office.deb
        dest: /tmp/wps-office.deb
        mode: '0644'

    - name: Install WPS Office package
      ansible.builtin.apt:
        deb: /tmp/wps-office.deb
        state: present
      environment:
        SUDO_USER: "root"
