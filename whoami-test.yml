---
- name: Configure RustDesk
  hosts: all
  become: true
  gather_facts: false

  vars:
    rustdesk_user: opoadmin
    rustdesk_home: /home/opoadmin
    rustdesk_config: /home/opoadmin/.config/rustdesk/RustDesk2.toml
    rustdesk_password: "Alb3rtp!nt0"

  tasks:

    - name: Check RustDesk installation
      ansible.builtin.command:
        cmd: /usr/bin/rustdesk --version
      register: rustdesk_version
      changed_when: false

    - name: Display RustDesk version
      ansible.builtin.debug:
        msg: "{{ rustdesk_version.stdout }}"

    - name: Configure direct server
      ansible.builtin.lineinfile:
        path: "{{ rustdesk_config }}"
        regexp: '^direct-server[[:space:]]*='
        line: "direct-server = 'Y'"
        insertafter: '^\[options\]'
        owner: "{{ rustdesk_user }}"
        group: "{{ rustdesk_user }}"
        mode: '0600'

    - name: Configure direct access port
      ansible.builtin.lineinfile:
        path: "{{ rustdesk_config }}"
        regexp: '^direct-access-port[[:space:]]*='
        line: "direct-access-port = '21118'"
        insertafter: '^\[options\]'
        owner: "{{ rustdesk_user }}"
        group: "{{ rustdesk_user }}"
        mode: '0600'

    - name: Configure permanent password authentication
      ansible.builtin.lineinfile:
        path: "{{ rustdesk_config }}"
        regexp: '^verification-method[[:space:]]*='
        line: "verification-method = 'use-permanent-password'"
        insertafter: '^\[options\]'
        owner: "{{ rustdesk_user }}"
        group: "{{ rustdesk_user }}"
        mode: '0600'

    - name: Set RustDesk permanent password
      ansible.builtin.command:
        argv:
          - /usr/bin/rustdesk
          - --password
          - "{{ rustdesk_password }}"
      become_user: "{{ rustdesk_user }}"
      environment:
        HOME: "{{ rustdesk_home }}"
        XDG_CONFIG_HOME: "{{ rustdesk_home }}/.config"
      no_log: true

    - name: Find active graphical session
      ansible.builtin.shell: |
        loginctl list-sessions --no-legend |
        awk '$3=="{{ rustdesk_user }}" && $4=="seat0" {print $1; exit}'
      register: graphical_session
      changed_when: false

    - name: Fail if graphical session is not found
      ansible.builtin.fail:
        msg: "No active graphical session found for {{ rustdesk_user }}"
      when: graphical_session.stdout | trim == ""

    - name: Get graphical session properties
      ansible.builtin.command:
        cmd: loginctl show-session {{ graphical_session.stdout | trim }} -p Display --value
      register: display_number
      changed_when: false

    - name: Start RustDesk in existing graphical session
      ansible.builtin.shell: |
        export DISPLAY={{ display_number.stdout | trim }}
        export XDG_RUNTIME_DIR=/run/user/$(id -u {{ rustdesk_user }})

        if ! pgrep -u {{ rustdesk_user }} -x rustdesk >/dev/null 2>&1; then
          sudo -u {{ rustdesk_user }} \
            env DISPLAY="$DISPLAY" \
                XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" \
            nohup /usr/bin/rustdesk \
            >/tmp/rustdesk-awx.log 2>&1 &
        fi
      changed_when: false

    - name: Wait for RustDesk startup
      ansible.builtin.pause:
        seconds: 5

    - name: Verify RustDesk process
      ansible.builtin.shell: |
        pgrep -a -u {{ rustdesk_user }} rustdesk
      register: rustdesk_process
      changed_when: false

    - name: Stop if RustDesk did not start
      ansible.builtin.fail:
        msg: |
          RustDesk failed to start.
          Startup log:
          {{ lookup('ansible.builtin.file', '/tmp/rustdesk-awx.log', errors='ignore') }}
      when: rustdesk_process.rc != 0

    - name: Verify RustDesk port
      ansible.builtin.shell: |
        ss -lntp | grep ':21118 '
      register: rustdesk_port
      changed_when: false

    - name: Display result
      ansible.builtin.debug:
        msg:
          - "RustDesk version: {{ rustdesk_version.stdout }}"
          - "Graphical session: {{ graphical_session.stdout | trim }}"
          - "Display: {{ display_number.stdout | trim }}"
          - "RustDesk process: RUNNING"
          - "RustDesk port: 21118 LISTENING"
