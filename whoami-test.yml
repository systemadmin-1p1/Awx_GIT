---
- name: Install WPS
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Check if WPS is already installed
      ansible.builtin.shell:
        cmd: dpkg -l | grep -i wps
      register: wps_check
      changed_when: false
      failed_when: false

    - name: Run apt update
      ansible.builtin.shell:
        cmd: apt update
      when: wps_check.rc != 0

    - name: Install WPS
      ansible.builtin.apt:
        name: wps-office
        state: present
      when: wps_check.rc != 0
