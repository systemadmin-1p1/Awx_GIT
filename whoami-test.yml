---
- name: Install WPS Office
  hosts: all
  become: yes
  gather_facts: false

  tasks:

    - name: Check if WPS Office is already installed
      ansible.builtin.shell:
        cmd: dpkg-query -W -f='${Status}' wps-office 2>/dev/null
      register: wps_check
      changed_when: false
      failed_when: false

    - name: Show WPS installation status
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {% if wps_check.stdout == 'install ok installed' %}
          WPS Office is already installed. Skipping installation.
          {% else %}
          WPS Office is not installed. Starting installation.
          {% endif %}

    - name: Download WPS deb on AWX runner
      ansible.builtin.get_url:
        url: "https://github.com/systemadmin-1p1/Awx_GIT/releases/download/wps-deb-11/wps-office_11.1.0.11733.XA_amd64.deb"
        dest: /tmp/wps-office.deb
      delegate_to: localhost
      run_once: true
      become: no
      when: wps_check.stdout != 'install ok installed'

    - name: Transfer deb to target machine
      ansible.builtin.copy:
        src: /tmp/wps-office.deb
        dest: /tmp/wps-office.deb
        mode: '0644'
      when: wps_check.stdout != 'install ok installed'

    - name: Unpack deb package
      ansible.builtin.command:
        cmd: dpkg --unpack /tmp/wps-office.deb
      when: wps_check.stdout != 'install ok installed'

    - name: Comment out buggy chgrp command in postinst script
      ansible.builtin.replace:
        path: /var/lib/dpkg/info/wps-office.postinst
        regexp: '^(.*chgrp.*)$'
        replace: '# \1'
      when: wps_check.stdout != 'install ok installed'

    - name: Complete package configuration
      ansible.builtin.command:
        cmd: dpkg --configure wps-office
      when: wps_check.stdout != 'install ok installed'

    - name: Clean up installer deb
      ansible.builtin.file:
        path: /tmp/wps-office.deb
        state: absent
      when: wps_check.stdout != 'install ok installed'
