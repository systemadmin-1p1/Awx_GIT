---
- name: Fix RustDesk Installation and Configure Direct GUI Access
  hosts: all
  become: true
  gather_facts: true

  vars:
    rustdesk_user: "opoadmin"
    rustdesk_user_config: "/home/opoadmin/.config/rustdesk/RustDesk2.toml"
    rustdesk_root_config: "/root/.config/rustdesk/RustDesk2.toml"
    rustdesk_port: "21118"
    rustdesk_password: "Alb3rtp!nt0"
    rustdesk_deb_url: "https://github.com/rustdesk/rustdesk/releases/download/1.3.7/rustdesk-1.3.7-x86_64.deb"

  tasks:
    - name: Download verified x86_64 RustDesk deb package
      ansible.builtin.get_url:
        url: "{{ rustdesk_deb_url }}"
        dest: "/tmp/rustdesk-correct.deb"
        mode: '0644'
        force: true

    - name: Force install/downgrade RustDesk package via dpkg
      ansible.builtin.command:
        cmd: dpkg -i --force-downgrade --force-overwrite /tmp/rustdesk-correct.deb
      register: dpkg_install
      changed_when: true

    - name: Resolve any missing dependencies
      ansible.builtin.command:
        cmd: apt-get install -f -y
      changed_when: false

    - name: Verify installed RustDesk binary works
      ansible.builtin.command:
        cmd: rustdesk --version
      register: rustdesk_version
      changed_when: false

    - name: Show verified RustDesk version
      ansible.builtin.debug:
        var: rustdesk_version.stdout

    - name: Ensure configuration directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "/home/{{ rustdesk_user }}/.config/rustdesk"
        - "/root/.config/rustdesk"

    - name: Ensure configuration files exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: touch
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: '0600'
        modification_time: preserve
        access_time: preserve
      loop:
        - { path: "{{ rustdesk_user_config }}", owner: "{{ rustdesk_user }}", group: "{{ rustdesk_user }}" }
        - { path: "{{ rustdesk_root_config }}", owner: "root", group: "root" }

    - name: Ensure [options] section header exists
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        line: "[options]"
        insertbefore: BOF
        state: present
      loop:
        - "{{ rustdesk_user_config }}"
        - "{{ rustdesk_root_config }}"

    - name: Configure Direct IP Access and verification method
      ansible.builtin.lineinfile:
        path: "{{ item.0 }}"
        regexp: "{{ item.1.regexp }}"
        line: "{{ item.1.line }}"
        insertafter: '^\[options\]'
        state: present
      loop: "{{ [rustdesk_user_config, rustdesk_root_config] | product([
          { 'regexp': '^direct-server[[:space:]]*=', 'line': \"direct-server = 'Y'\" },
          { 'regexp': '^direct-access-port[[:space:]]*=', 'line': \"direct-access-port = '\" ~ rustdesk_port ~ \"'\" },
          { 'regexp': '^verification-method[[:space:]]*=', 'line': \"verification-method = 'use-permanent-password'\" }
        ]) | list }}"

    - name: Set permanent password
      ansible.builtin.command:
        cmd: "rustdesk --password {{ rustdesk_password }}"
      changed_when: true
      no_log: true

    - name: Allow port {{ rustdesk_port }} in UFW if firewall is enabled
      ansible.builtin.shell: |
        if command -v ufw >/dev/null 2>&1 && ufw status | grep -q "Status: active"; then
          ufw allow {{ rustdesk_port }}/tcp
        fi
      changed_when: false

    - name: Restart RustDesk system daemon
      ansible.builtin.systemd:
        name: rustdesk
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Wait for socket binding
      ansible.builtin.pause:
        seconds: 4

    - name: Confirm port {{ rustdesk_port }} is listening
      ansible.builtin.shell: |
        ss -lntup | grep -E ':{{ rustdesk_port }}\b'
      register: final_ports
      changed_when: false
      failed_when: final_ports.stdout == ""

    - name: Display listening port confirmation
      ansible.builtin.debug:
        var: final_ports.stdout_lines
