---
- name: Configure RustDesk on desktops
  hosts: all
  become: true
  gather_facts: false

  vars:
    rustdesk_user: "opoadmin"
    rustdesk_config: "/home/opoadmin/.config/rustdesk/RustDesk2.toml"
    rustdesk_port: "21118"
    rustdesk_password: "Alb3rtp!nt0"

  tasks:

    - name: Check RustDesk installation
      ansible.builtin.command:
        cmd: rustdesk --version
      register: rustdesk_version
      changed_when: false

    - name: Show RustDesk version
      ansible.builtin.debug:
        msg: "RustDesk version: {{ rustdesk_version.stdout }}"

    - name: Check RustDesk configuration file
      ansible.builtin.stat:
        path: "{{ rustdesk_config }}"
      register: rustdesk_config_file

    - name: Stop if RustDesk configuration does not exist
      ansible.builtin.fail:
        msg: "RustDesk configuration file not found: {{ rustdesk_config }}"
      when: not rustdesk_config_file.stat.exists

    - name: Show current RustDesk configuration
      ansible.builtin.shell: |
        grep -E "^(direct-server|direct-access-port|verification-method)" \
        "{{ rustdesk_config }}" || true
      register: current_config
      changed_when: false

    - name: Display current configuration
      ansible.builtin.debug:
        var: current_config.stdout_lines

    - name: Enable Direct IP Access
      ansible.builtin.lineinfile:
        path: "{{ rustdesk_config }}"
        regexp: '^direct-server[[:space:]]*='
        line: "direct-server = 'Y'"
        insertafter: '^\[options\]'
        owner: "{{ rustdesk_user }}"
        group: "{{ rustdesk_user }}"
        mode: '0600'
      register: direct_server_config

    - name: Configure Direct IP Access Port
      ansible.builtin.lineinfile:
        path: "{{ rustdesk_config }}"
        regexp: '^direct-access-port[[:space:]]*='
        line: "direct-access-port = '{{ rustdesk_port }}'"
        insertafter: '^\[options\]'
        owner: "{{ rustdesk_user }}"
        group: "{{ rustdesk_user }}"
        mode: '0600'
      register: direct_port_config

    - name: Configure Permanent Password authentication
      ansible.builtin.lineinfile:
        path: "{{ rustdesk_config }}"
        regexp: '^verification-method[[:space:]]*='
        line: "verification-method = 'use-permanent-password'"
        insertafter: '^\[options\]'
        owner: "{{ rustdesk_user }}"
        group: "{{ rustdesk_user }}"
        mode: '0600'
      register: verification_config

    - name: Set RustDesk permanent password
      ansible.builtin.command:
        argv:
          - rustdesk
          - --password
          - "{{ rustdesk_password }}"
      become_user: "{{ rustdesk_user }}"
      environment:
        HOME: "/home/{{ rustdesk_user }}"
        XDG_CONFIG_HOME: "/home/{{ rustdesk_user }}/.config"
      no_log: true
      register: password_result
      changed_when: true

    - name: Check RustDesk processes
      ansible.builtin.shell: |
        ps -ef | grep -i '[r]ustdesk'
      register: rustdesk_process
      changed_when: false
      failed_when: false

    - name: Show RustDesk processes
      ansible.builtin.debug:
        var: rustdesk_process.stdout_lines

    - name: Check RustDesk listening ports
      ansible.builtin.shell: |
        ss -lntup | grep -E '(:21115|:21116|:21117|:21118)' || true
      register: rustdesk_ports
      changed_when: false

    - name: Show RustDesk listening ports
      ansible.builtin.debug:
        var: rustdesk_ports.stdout_lines

    - name: Restart RustDesk user process
      ansible.builtin.shell: |
        pkill -u "{{ rustdesk_user }}" -x rustdesk || true
        sleep 3
        nohup rustdesk >/tmp/rustdesk-start.log 2>&1 &
      become_user: "{{ rustdesk_user }}"
      environment:
        HOME: "/home/{{ rustdesk_user }}"
        XDG_CONFIG_HOME: "/home/{{ rustdesk_user }}/.config"
      when:
        - direct_server_config.changed
          or direct_port_config.changed
          or verification_config.changed

    - name: Wait for RustDesk process
      ansible.builtin.pause:
        seconds: 5

    - name: Verify RustDesk process after configuration
      ansible.builtin.shell: |
        ps -ef | grep -i '[r]ustdesk'
      register: rustdesk_process_after
      changed_when: false
      failed_when: false

    - name: Show RustDesk process after configuration
      ansible.builtin.debug:
        var: rustdesk_process_after.stdout_lines

    - name: Verify RustDesk configuration
      ansible.builtin.shell: |
        grep -E "^(direct-server|direct-access-port|verification-method)" \
        "{{ rustdesk_config }}"
      register: rustdesk_settings
      changed_when: false

    - name: Display configured RustDesk settings
      ansible.builtin.debug:
        var: rustdesk_settings.stdout_lines

    - name: Verify RustDesk ports
      ansible.builtin.shell: |
        ss -lntup | grep -E '(:21115|:21116|:21117|:21118)' || true
      register: final_ports
      changed_when: false

    - name: Display RustDesk ports
      ansible.builtin.debug:
        var: final_ports.stdout_lines
