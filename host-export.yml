---
- name: Export Ubuntu Netplan Configuration
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Display Netplan Configuration
      ansible.builtin.shell: |
        if [ -d /etc/netplan ]; then
          for file in /etc/netplan/*.yaml /etc/netplan/*.yml; do
            if [ -f "$file" ]; then
              echo "===== $file ====="
              cat "$file"
              echo ""
            fi
          done
        else
          echo "Netplan directory not found"
        fi
      args:
        executable: /bin/bash
      register: netplan_output
      changed_when: false

    - name: Show Netplan Configuration Output
      ansible.builtin.debug:
        msg: |
          HOST: {{ inventory_hostname }}
          {{ netplan_output.stdout }}
