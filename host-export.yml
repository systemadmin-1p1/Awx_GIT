- name: Export Ubuntu Netplan Configuration
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Extract Netplan IP and CIDR
      ansible.builtin.shell: |
        awk '
          /addresses:/ { flag=1 }
          /^[[:space:]]*[a-zA-Z0-9_]+:/ && !/addresses:/ { flag=0 }
          flag { print }
        ' /etc/netplan/*.yaml /etc/netplan/*.yml 2>/dev/null \
        | grep -oE '(([0-9]{1,3}\.){3}[0-9]{1,3}|[a-fA-F0-9:]+)/[0-9]{1,3}' \
        | sort -u || true
      args:
        executable: /bin/bash
      register: netplan_ips
      changed_when: false

    - name: Show Netplan IP and CIDR Output
      ansible.builtin.debug:
        msg: |
          HOST: {{ inventory_hostname }}
          IP/CIDR:
          {{ netplan_ips.stdout if netplan_ips.stdout != '' else 'No static IP/CIDR found (e.g., DHCP active or Netplan missing)' }}
