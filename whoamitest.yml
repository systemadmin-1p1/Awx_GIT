- name: Detect RAM
  ansible.builtin.command:
    cmd: free -m
  register: ram_info
  changed_when: false

- name: Detect CPU
  ansible.builtin.command:
    cmd: nproc
  register: cpu_info
  changed_when: false

- name: Detect disk type
  ansible.builtin.shell:
    cmd: |
      lsblk -dn -o NAME,ROTA
  register: disk_type
  changed_when: false

- name: Show hardware
  ansible.builtin.debug:
    msg:
      - "CPU cores: {{ cpu_info.stdout }}"
      - "Memory:"
      - "{{ ram_info.stdout }}"
      - "Disk:"
      - "{{ disk_type.stdout }}"
