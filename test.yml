---
# ============================================================
# PLAY 1: DOWNLOAD UYUNI PACKAGE ON AWX
# AWX HAS INTERNET ACCESS
# CLIENTS DO NOT NEED INTERNET ACCESS
# Original offline download and checksum workflow preserved.
# ============================================================

- name: Download Uyuni Salt Minion package on AWX
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    awx_stage_dir: "/tmp/uyuni_offline"
    uyuni_repo_url: "https://download.opensuse.org/repositories/systemsmanagement:/Uyuni:/Master:/Ubuntu2404-Uyuni-Client-Tools/xUbuntu_24.04"
    awx_packages_index: "/tmp/uyuni_offline/Packages.gz"
    awx_venv_deb: "/tmp/uyuni_offline/venv-salt-minion.deb"

  tasks:
    - name: Create temporary package directory on AWX
      ansible.builtin.file:
        path: "{{ awx_stage_dir }}"
        state: directory
        mode: "0755"

    - name: Download Uyuni repository package index
      ansible.builtin.get_url:
        url: "{{ uyuni_repo_url }}/Packages.gz"
        dest: "{{ awx_packages_index }}"
        mode: "0644"
        force: true
        validate_certs: true

    - name: Find current AMD64 venv-salt-minion package metadata
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import gzip
            import json
            import re
            import sys

            with gzip.open(sys.argv[1], "rt", encoding="utf-8") as source:
                content = source.read()

            for block in content.split("\n\n"):
                fields = {}
                for line in block.splitlines():
                    if line.startswith((" ", "\t")):
                        continue
                    if ": " in line:
                        key, value = line.split(": ", 1)
                        fields[key] = value.strip()

                if fields.get("Package") == "venv-salt-minion" and fields.get("Architecture") == "amd64":
                    filename = fields.get("Filename", "")
                    checksum = fields.get("SHA256", "")
                    if (
                        not filename
                        or filename.startswith("/")
                        or ".." in filename.split("/")
                        or not re.fullmatch(r"[a-fA-F0-9]{64}", checksum)
                    ):
                        raise SystemExit("Invalid package metadata")

                    print(json.dumps({
                        "filename": filename,
                        "sha256": checksum,
                        "version": fields.get("Version", ""),
                        "architecture": fields.get("Architecture", ""),
                        "depends": fields.get("Depends", ""),
                        "size": fields.get("Size", "")
                    }))
                    sys.exit(0)

            raise SystemExit("venv-salt-minion AMD64 package not found")
          - "{{ awx_packages_index }}"
      register: package_metadata
      changed_when: false

    - name: Store package metadata on AWX
      ansible.builtin.set_fact:
        uyuni_package_record: "{{ package_metadata.stdout | from_json }}"

    - name: Validate package metadata
      ansible.builtin.assert:
        that:
          - uyuni_package_record.architecture == "amd64"
          - uyuni_package_record.filename | length > 0
          - uyuni_package_record.sha256 | length == 64
          - uyuni_package_record.version | length > 0
        fail_msg: "Invalid venv-salt-minion package metadata."

    - name: Display selected package version
      ansible.builtin.debug:
        msg:
          - "Package: venv-salt-minion"
          - "Version: {{ uyuni_package_record.version }}"
          - "Architecture: {{ uyuni_package_record.architecture }}"
          - "Size: {{ uyuni_package_record.size }} bytes"

    - name: Download venv-salt-minion DEB package on AWX
      ansible.builtin.get_url:
        url: "{{ uyuni_repo_url }}/{{ uyuni_package_record.filename | regex_replace('^\\./', '') }}"
        dest: "{{ awx_venv_deb }}"
        mode: "0644"
        force: true
        validate_certs: true
        checksum: "sha256:{{ uyuni_package_record.sha256 }}"

    - name: Verify downloaded DEB package
      ansible.builtin.stat:
        path: "{{ awx_venv_deb }}"
        checksum_algorithm: sha256
      register: awx_deb_check

    - name: Validate downloaded package checksum
      ansible.builtin.assert:
        that:
          - awx_deb_check.stat.exists
          - awx_deb_check.stat.isreg
          - awx_deb_check.stat.checksum == uyuni_package_record.sha256
        fail_msg: "Downloaded DEB package checksum verification failed."

    - name: Store AWX package information for target play
      ansible.builtin.set_fact:
        uyuni_awx_deb_path: "{{ awx_venv_deb }}"
        uyuni_awx_deb_sha256: "{{ uyuni_package_record.sha256 }}"
        uyuni_awx_deb_version: "{{ uyuni_package_record.version }}"

    - name: Display AWX download result
      ansible.builtin.debug:
        msg: "Uyuni Salt Minion downloaded and checksum verified on AWX."


# ============================================================
# PLAY 2: TRANSFER, INSTALL AND CONFIGURE OFFLINE ON CLIENTS
# ORIGINAL SALT CONNECTION CONFIGURATION IS PRESERVED.
# CLIENTS DO NOT NEED INTERNET ACCESS.
# ============================================================

- name: Install and configure Uyuni Salt Minion on clients
  hosts: "all:!localhost"
  # Delay fact gathering until AWX has checked the target SSH endpoint.
  gather_facts: false
  become: false
  serial: 5

  vars:
    target_staging_dir: "/root/uyuni_offline"
    target_deb: "/root/uyuni_offline/venv-salt-minion.deb"

    uyuni_master: "uyuni.1point1.in"
    uyuni_activation_key: "1-ubuntu-24.04-pool-amd64-uyuni"

    # Set TRUE only for a newly cloned/unregistered client whose identity
    # must be regenerated. Leave FALSE for already registered production hosts.
    uyuni_reset_clone_identity: true

    # Marker makes identity reset idempotent on the same hostname. If a VM is
    # cloned after this playbook has run, the changed hostname causes a new reset.
    uyuni_identity_state_dir: "/var/lib/uyuni-offline-minion"
    uyuni_identity_state_file: "/var/lib/uyuni-offline-minion/identity-reset.done"

    # Salt Bundle paths documented by Uyuni.
    uyuni_salt_minion_id_file: "/etc/venv-salt-minion/minion_id"
    uyuni_salt_pki_dir: "/etc/venv-salt-minion/pki"

  pre_tasks:
    # --------------------------------------------------------
    # SSH PREFLIGHT FROM AWX
    # This runs on the AWX execution environment, before any
    # remote task or fact gathering. It gives a clear diagnosis
    # when the target SSH port is closed/refusing connections.
    # Set ansible_host / ansible_port / ansible_user in AWX
    # inventory/credentials as required for each target.
    # --------------------------------------------------------

    - name: Display the SSH endpoint selected by AWX inventory
      ansible.builtin.debug:
        msg:
          - "Inventory host: {{ inventory_hostname }}"
          - "SSH destination: {{ ansible_host | default(inventory_hostname) }}"
          - "SSH port: {{ ansible_port | default(22) }}"
          - "SSH user: {{ ansible_user | default('user from AWX credential or SSH config') }}"

    - name: Check target SSH TCP port from AWX before connecting
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ ansible_port | default(22) | int }}"
        state: started
        connect_timeout: 3
        sleep: 2
        timeout: 8
      delegate_to: localhost
      become: false
      register: ssh_tcp_preflight
      ignore_errors: true
      changed_when: false

    - name: Stop with a clear message when target SSH port is unavailable
      ansible.builtin.fail:
        msg: >-
          AWX cannot open SSH to {{ ansible_host | default(inventory_hostname) }}:
          {{ ansible_port | default(22) }}. The earlier error was
          'Connection refused'. This is not a Salt Minion or YAML task failure:
          the target is refusing TCP SSH connections. Verify that ssh.service
          is running on the target, that the target IP is correct, that the
          SSH port matches ansible_port, and that the network/firewall permits
          AWX to reach that port. No client changes have been made by this play.
      when: >-
        (ssh_tcp_preflight is failed)
        or (ssh_tcp_preflight.state | default('') != 'started')

    - name: Verify Ansible SSH authentication and remote command execution
      ansible.builtin.ping:
      register: ssh_login_preflight
      ignore_unreachable: true
      ignore_errors: true

    - name: Stop with a clear message when SSH authentication fails
      ansible.builtin.fail:
        msg: >-
          TCP SSH port is reachable, but Ansible could not authenticate or run
          its ping module on {{ inventory_hostname }}. Check the AWX machine
          credential, SSH username, private key, authorized_keys, and remote
          Python availability. No installation or identity changes have run.
      when: >-
        (ssh_login_preflight is failed)
        or (ssh_login_preflight.unreachable | default(false))

    - name: Gather client facts after SSH preflight succeeds
      ansible.builtin.setup:

    - name: Validate Ubuntu 24.04 AMD64 client
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "Debian"
          - ansible_facts['architecture'] == "x86_64"
          - ansible_facts['service_mgr'] == "systemd"
        fail_msg: "Only AMD64 Debian-family clients using systemd are supported."

    - name: Verify Ubuntu Noble release
      ansible.builtin.command:
        argv:
          - grep
          - -Eq
          - "^(VERSION_CODENAME|UBUNTU_CODENAME)=noble$"
          - /etc/os-release
      register: noble_check
      changed_when: false
      failed_when: false

    - name: Stop if client is not Ubuntu 24.04 based
      ansible.builtin.assert:
        that:
          - noble_check.rc == 0
        fail_msg: "Client is not based on Ubuntu 24.04 Noble."

    - name: Verify Uyuni package exists on AWX
      ansible.builtin.stat:
        path: "{{ hostvars['localhost']['uyuni_awx_deb_path'] }}"
      delegate_to: localhost
      become: false
      register: controller_package

    - name: Validate AWX package
      ansible.builtin.assert:
        that:
          - controller_package.stat.exists
          - controller_package.stat.size | int > 0
        fail_msg: "Uyuni package is missing from AWX."

    # Preserve the original working connectivity pre-check. No additional
    # mandatory TCP 4505/4506 probes or Salt master fingerprint override.
    - name: Verify Uyuni master hostname resolves
      ansible.builtin.command:
        argv:
          - getent
          - hosts
          - "{{ uyuni_master }}"
      register: uyuni_dns_check
      changed_when: false
      failed_when: uyuni_dns_check.rc != 0

    # --------------------------------------------------------
    # OPTIONAL CLONE IDENTITY REGENERATION
    # Runs only when uyuni_reset_clone_identity=true for that host.
    # The original machine must NOT have this variable enabled.
    # --------------------------------------------------------

    - name: Read current machine ID
      ansible.builtin.command:
        argv:
          - cat
          - /etc/machine-id
      register: old_machine_id
      changed_when: false
      failed_when: false
      when: uyuni_reset_clone_identity | bool

    - name: Read current FQDN
      ansible.builtin.command:
        argv:
          - hostname
          - -f
      register: client_fqdn
      changed_when: false
      when: uyuni_reset_clone_identity | bool

    - name: Read completed identity marker when present
      ansible.builtin.slurp:
        src: "{{ uyuni_identity_state_file }}"
      register: identity_marker
      failed_when: false
      when: uyuni_reset_clone_identity | bool

    - name: Calculate whether clone identity reset is required
      ansible.builtin.set_fact:
        uyuni_identity_marker_value: >-
          {{ (identity_marker.content | b64decode | trim)
             if (identity_marker is defined and identity_marker.content is defined)
             else '' }}
        uyuni_identity_marker_expected: >-
          {{ (old_machine_id.stdout | default('') | trim) ~ '|' ~ (client_fqdn.stdout | default('') | trim | lower) }}
      when: uyuni_reset_clone_identity | bool

    - name: Set identity reset decision
      ansible.builtin.set_fact:
        uyuni_identity_reset_required: >-
          {{ uyuni_identity_marker_value != uyuni_identity_marker_expected }}
      when: uyuni_reset_clone_identity | bool

    - name: Validate clone hostname before changing identity
      ansible.builtin.assert:
        that:
          - client_fqdn.stdout | trim | length > 2
          - "'.' in (client_fqdn.stdout | trim)"
          - old_machine_id.stdout | trim is match('^[0-9a-fA-F]{32}$')
        fail_msg: >-
          Cannot safely reset identity: a valid machine ID and unique FQDN are
          required. Set the clone hostname and DNS/hosts entry before running.
      when:
        - uyuni_reset_clone_identity | bool
        - uyuni_identity_reset_required | bool

    - name: Gather current service facts before identity reset
      ansible.builtin.service_facts:
      when:
        - uyuni_reset_clone_identity | bool
        - uyuni_identity_reset_required | bool

    - name: Stop existing Salt Bundle service before identity reset
      ansible.builtin.systemd:
        name: venv-salt-minion.service
        state: stopped
      when:
        - uyuni_reset_clone_identity | bool
        - uyuni_identity_reset_required | bool
        - "'venv-salt-minion.service' in ansible_facts.services"
      become: true

    - name: Remove cloned system machine ID
      ansible.builtin.file:
        path: /etc/machine-id
        state: absent
      when:
        - uyuni_reset_clone_identity | bool
        - uyuni_identity_reset_required | bool
      become: true

    - name: Remove cloned D-Bus machine ID
      ansible.builtin.file:
        path: /var/lib/dbus/machine-id
        state: absent
      when:
        - uyuni_reset_clone_identity | bool
        - uyuni_identity_reset_required | bool
      become: true

    - name: Generate a new D-Bus machine ID
      ansible.builtin.command:
        argv:
          - dbus-uuidgen
          - --ensure
      register: dbus_id_result
      changed_when: true
      when:
        - uyuni_reset_clone_identity | bool
        - uyuni_identity_reset_required | bool
      become: true

    - name: Generate a new systemd machine ID
      ansible.builtin.command:
        argv:
          - systemd-machine-id-setup
      register: machine_id_result
      changed_when: true
      when:
        - uyuni_reset_clone_identity | bool
        - uyuni_identity_reset_required | bool
      become: true

    - name: Read regenerated machine ID
      ansible.builtin.command:
        argv:
          - cat
          - /etc/machine-id
      register: new_machine_id
      changed_when: false
      when:
        - uyuni_reset_clone_identity | bool
        - uyuni_identity_reset_required | bool
      become: true

    - name: Validate regenerated machine ID is unique from previous value
      ansible.builtin.assert:
        that:
          - new_machine_id.stdout | trim is match('^[0-9a-fA-F]{32}$')
          - new_machine_id.stdout | trim != old_machine_id.stdout | trim
        fail_msg: "Machine ID regeneration failed or returned the previous ID."
      when:
        - uyuni_reset_clone_identity | bool
        - uyuni_identity_reset_required | bool

    - name: Remove cloned Salt Bundle minion ID so FQDN is regenerated
      ansible.builtin.file:
        path: "{{ uyuni_salt_minion_id_file }}"
        state: absent
      when:
        - uyuni_reset_clone_identity | bool
        - uyuni_identity_reset_required | bool
      become: true

    - name: Remove cloned Salt Bundle PKI identity
      ansible.builtin.file:
        path: "{{ uyuni_salt_pki_dir }}"
        state: absent
      when:
        - uyuni_reset_clone_identity | bool
        - uyuni_identity_reset_required | bool
      become: true

    - name: Create identity marker directory
      ansible.builtin.file:
        path: "{{ uyuni_identity_state_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when:
        - uyuni_reset_clone_identity | bool
        - uyuni_identity_reset_required | bool
      become: true

    - name: Record completed clone identity reset
      ansible.builtin.copy:
        dest: "{{ uyuni_identity_state_file }}"
        content: "{{ new_machine_id.stdout | trim }}|{{ client_fqdn.stdout | trim | lower }}\n"
        owner: root
        group: root
        mode: "0600"
      when:
        - uyuni_reset_clone_identity | bool
        - uyuni_identity_reset_required | bool
      become: true

  tasks:
    # --------------------------------------------------------
    # TRANSFER PACKAGE (ORIGINAL WORKFLOW PRESERVED)
    # --------------------------------------------------------

    - name: Create package staging directory on client
      ansible.builtin.file:
        path: "{{ target_staging_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      become: true

    - name: Transfer Uyuni DEB package from AWX to client
      ansible.builtin.copy:
        src: "{{ hostvars['localhost']['uyuni_awx_deb_path'] }}"
        dest: "{{ target_deb }}"
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Verify transferred package on client
      ansible.builtin.stat:
        path: "{{ target_deb }}"
        checksum_algorithm: sha256
      register: target_deb_check
      become: true

    - name: Validate transferred package checksum
      ansible.builtin.assert:
        that:
          - target_deb_check.stat.exists
          - target_deb_check.stat.checksum == hostvars['localhost']['uyuni_awx_deb_sha256']
        fail_msg: "Package transfer or checksum verification failed."

    # --------------------------------------------------------
    # OFFLINE INSTALLATION (ORIGINAL WORKFLOW PRESERVED)
    # --------------------------------------------------------

    - name: Install Uyuni Salt Minion from local DEB
      ansible.builtin.command:
        argv:
          - dpkg
          - --install
          - "{{ target_deb }}"
      register: minion_install
      changed_when: minion_install.rc == 0
      become: true

    - name: Verify Uyuni Salt Minion installation
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - "-f=${Status}"
          - venv-salt-minion
      register: package_status
      changed_when: false
      failed_when: package_status.stdout | trim != "install ok installed"
      become: true

    # --------------------------------------------------------
    # UYUNI CONFIGURATION
    # EXACT ORIGINAL WORKING CONNECTION BLOCK:
    # no forced id and no master_finger override.
    # --------------------------------------------------------

    - name: Create Uyuni configuration directory
      ansible.builtin.file:
        path: /etc/venv-salt-minion/minion.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Configure Uyuni Salt Minion using original connection settings
      ansible.builtin.copy:
        dest: /etc/venv-salt-minion/minion.d/uyuni.conf
        content: |
          master: {{ uyuni_master }}
          server_id_use_crc: adler32
          enable_legacy_startup_events: False
          enable_fqdns_grains: False

          grains:
            susemanager:
              activation_key: "{{ uyuni_activation_key }}"
        owner: root
        group: root
        mode: "0640"
      no_log: true
      register: minion_configuration
      become: true

    # --------------------------------------------------------
    # START SERVICE (ORIGINAL WORKFLOW PRESERVED)
    # --------------------------------------------------------

    - name: Enable and start Uyuni Salt Minion
      ansible.builtin.systemd:
        name: venv-salt-minion
        enabled: true
        state: restarted
      become: true

    # --------------------------------------------------------
    # VERIFICATION
    # --------------------------------------------------------

    - name: Verify package installation
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - "-f=${Status}"
          - venv-salt-minion
      register: package_status_final
      changed_when: false
      failed_when: package_status_final.stdout | trim != "install ok installed"
      become: true

    - name: Verify minion service
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - venv-salt-minion
      register: service_status
      changed_when: false
      failed_when: service_status.stdout | trim != "active"
      become: true

    - name: Read final machine ID
      ansible.builtin.command:
        argv:
          - cat
          - /etc/machine-id
      register: final_machine_id
      changed_when: false
      become: true

    - name: Read generated Salt Minion ID when available
      ansible.builtin.command:
        argv:
          - cat
          - "{{ uyuni_salt_minion_id_file }}"
      register: final_minion_id
      changed_when: false
      failed_when: false
      become: true

    # --------------------------------------------------------
    # CLEANUP (ORIGINAL WORKFLOW PRESERVED)
    # --------------------------------------------------------

    - name: Remove temporary DEB package after successful installation
      ansible.builtin.file:
        path: "{{ target_staging_dir }}"
        state: absent
      become: true

    - name: Display final installation report
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "UYUNI OFFLINE INSTALLATION COMPLETED"
          - "=========================================="
          - "Client: {{ inventory_hostname }}"
          - "OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "Machine ID: {{ final_machine_id.stdout | trim }}"
          - "Salt Minion ID: {{ final_minion_id.stdout | default('not yet generated; Salt uses hostname/FQDN') | trim }}"
          - "Identity reset requested: {{ uyuni_reset_clone_identity }}"
          - "Package: venv-salt-minion"
          - "Version: {{ hostvars['localhost']['uyuni_awx_deb_version'] }}"
          - "Package status: {{ package_status_final.stdout | trim }}"
          - "Service status: {{ service_status.stdout | trim }}"
          - "Uyuni master: {{ uyuni_master }}"
          - "Activation key: {{ uyuni_activation_key }}"
          - "=========================================="
          - "A running service does not prove that Uyuni accepted the Salt key."

    - name: Display stale-key handling reminder after clone identity reset
      ansible.builtin.debug:
        msg:
          - "Identity was regenerated on {{ inventory_hostname }} only."
          - "Check Uyuni pending/accepted keys for this clone's Minion ID."
          - "Remove only a stale key belonging to this clone, then accept its new pending key."
          - "Do not remove the original client's key or system profile."
      when:
        - uyuni_reset_clone_identity | bool
        - uyuni_identity_reset_required | bool
