
---
# ============================================================
# PLAY 1: DOWNLOAD UYUNI PACKAGE ON AWX
# AWX HAS INTERNET ACCESS
# ============================================================

- name: Download Uyuni Salt Minion package on AWX
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    awx_stage_dir: "/tmp/uyuni_offline"

    uyuni_repo_url: "https://download.opensuse.org/repositories/systemsmanagement:/Uyuni:/Master:/Ubuntu2404-Uyuni-Client-Tools/xUbuntu_24.04"

    awx_packages_index: "/tmp/uyuni_offline/Packages.gz"
    awx_venv_deb: "/tmp/uyuni_offline/venv-salt-minion.deb"

  tasks:

    - name: Create temporary package directory on AWX
      ansible.builtin.file:
        path: "{{ awx_stage_dir }}"
        state: directory
        mode: "0755"

    - name: Download Uyuni repository package index
      ansible.builtin.get_url:
        url: "{{ uyuni_repo_url }}/Packages.gz"
        dest: "{{ awx_packages_index }}"
        mode: "0644"
        force: true
        validate_certs: true

    - name: Find current AMD64 venv-salt-minion package metadata
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import gzip
            import json
            import re
            import sys

            with gzip.open(sys.argv[1], "rt", encoding="utf-8") as source:
                content = source.read()

            for block in content.split("\n\n"):
                fields = {}

                for line in block.splitlines():
                    if line.startswith((" ", "\t")):
                        continue

                    if ": " in line:
                        key, value = line.split(": ", 1)
                        fields[key] = value.strip()

                if (
                    fields.get("Package") == "venv-salt-minion"
                    and fields.get("Architecture") == "amd64"
                ):
                    filename = fields.get("Filename", "")
                    checksum = fields.get("SHA256", "")

                    if (
                        not filename
                        or filename.startswith("/")
                        or ".." in filename.split("/")
                        or not re.fullmatch(r"[a-fA-F0-9]{64}", checksum)
                    ):
                        raise SystemExit("Invalid package metadata")

                    print(json.dumps({
                        "filename": filename,
                        "sha256": checksum,
                        "version": fields.get("Version", ""),
                        "architecture": fields.get("Architecture", ""),
                        "depends": fields.get("Depends", ""),
                        "size": fields.get("Size", "")
                    }))

                    sys.exit(0)

            raise SystemExit("venv-salt-minion AMD64 package not found")
          - "{{ awx_packages_index }}"
      register: package_metadata
      changed_when: false

    - name: Store package metadata on AWX
      ansible.builtin.set_fact:
        uyuni_package_record: "{{ package_metadata.stdout | from_json }}"

    - name: Validate package metadata
      ansible.builtin.assert:
        that:
          - uyuni_package_record.architecture == "amd64"
          - uyuni_package_record.filename | length > 0
          - uyuni_package_record.sha256 | length == 64
          - uyuni_package_record.version | length > 0
        fail_msg: "Invalid venv-salt-minion package metadata."

    - name: Display selected package version
      ansible.builtin.debug:
        msg:
          - "Package: venv-salt-minion"
          - "Version: {{ uyuni_package_record.version }}"
          - "Architecture: {{ uyuni_package_record.architecture }}"
          - "Size: {{ uyuni_package_record.size }} bytes"

    - name: Download venv-salt-minion DEB package on AWX
      ansible.builtin.get_url:
        url: "{{ uyuni_repo_url }}/{{ uyuni_package_record.filename | regex_replace('^\\./', '') }}"
        dest: "{{ awx_venv_deb }}"
        mode: "0644"
        force: true
        validate_certs: true
        checksum: "sha256:{{ uyuni_package_record.sha256 }}"

    - name: Verify downloaded DEB package
      ansible.builtin.stat:
        path: "{{ awx_venv_deb }}"
        checksum_algorithm: sha256
      register: awx_deb_check

    - name: Validate downloaded package checksum
      ansible.builtin.assert:
        that:
          - awx_deb_check.stat.exists
          - awx_deb_check.stat.isreg
          - awx_deb_check.stat.checksum == uyuni_package_record.sha256
        fail_msg: "Downloaded DEB package checksum verification failed."

    - name: Store AWX package information for target play
      ansible.builtin.set_fact:
        uyuni_awx_deb_path: "{{ awx_venv_deb }}"
        uyuni_awx_deb_sha256: "{{ uyuni_package_record.sha256 }}"
        uyuni_awx_deb_version: "{{ uyuni_package_record.version }}"

    - name: Display AWX download result
      ansible.builtin.debug:
        msg: "Uyuni Salt Minion downloaded and checksum verified on AWX."


# ============================================================
# PLAY 2: TRANSFER AND INSTALL OFFLINE ON CLIENTS
# CLIENTS DO NOT NEED INTERNET ACCESS
# ============================================================

- name: Install and configure Uyuni Salt Minion on clients
  hosts: "all:!localhost"
  gather_facts: true
  become: false
  serial: 5

  vars:
    target_staging_dir: "/root/uyuni_offline"

    target_deb: "/root/uyuni_offline/venv-salt-minion.deb"

    uyuni_master: "uyuni.1point1.in"

    uyuni_activation_key: "1-ubuntu-24.04-pool-amd64-uyuni"

    # Set true ONLY for a newly cloned/unregistered client.
    # Keep false for existing registered/production clients.
    uyuni_reset_clone_identity: false

    # Uyuni Salt Bundle identity locations.
    uyuni_salt_minion_id_file: "/etc/venv-salt-minion/minion_id"
    uyuni_salt_pki_dir: "/etc/venv-salt-minion/pki"

  pre_tasks:

    - name: Validate Ubuntu 24.04 AMD64 client
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "Debian"
          - ansible_facts['architecture'] == "x86_64"
        fail_msg: "Only AMD64 Debian-family clients are supported."

    - name: Verify Ubuntu Noble release
      ansible.builtin.command:
        argv:
          - grep
          - -Eq
          - "^(VERSION_CODENAME|UBUNTU_CODENAME)=noble$"
          - /etc/os-release
      changed_when: false
      failed_when: false
      register: noble_check

    - name: Stop if client is not Ubuntu 24.04 based
      ansible.builtin.assert:
        that:
          - noble_check.rc == 0
        fail_msg: "Client is not based on Ubuntu 24.04 Noble."

    - name: Verify Uyuni package exists on AWX
      ansible.builtin.stat:
        path: "{{ hostvars['localhost']['uyuni_awx_deb_path'] }}"
      delegate_to: localhost
      become: false
      register: controller_package

    - name: Validate AWX package
      ansible.builtin.assert:
        that:
          - controller_package.stat.exists
          - controller_package.stat.size | int > 0
        fail_msg: "Uyuni package is missing from AWX."

    - name: Verify Uyuni master hostname resolves
      ansible.builtin.command:
        argv:
          - getent
          - hosts
          - "{{ uyuni_master }}"
      register: uyuni_dns_check
      changed_when: false
      failed_when: uyuni_dns_check.rc != 0

  tasks:

    # --------------------------------------------------------
    # TRANSFER PACKAGE
    # --------------------------------------------------------

    - name: Create package staging directory on client
      ansible.builtin.file:
        path: "{{ target_staging_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      become: true

    - name: Transfer Uyuni DEB package from AWX to client
      ansible.builtin.copy:
        src: "{{ hostvars['localhost']['uyuni_awx_deb_path'] }}"
        dest: "{{ target_deb }}"
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Verify transferred package on client
      ansible.builtin.stat:
        path: "{{ target_deb }}"
        checksum_algorithm: sha256
      register: target_deb_check
      become: true

    - name: Validate transferred package checksum
      ansible.builtin.assert:
        that:
          - target_deb_check.stat.exists
          - target_deb_check.stat.checksum == hostvars['localhost']['uyuni_awx_deb_sha256']
        fail_msg: "Package transfer or checksum verification failed."

    # --------------------------------------------------------
    # OFFLINE INSTALLATION
    # --------------------------------------------------------

    # --------------------------------------------------------
    # TARGETED PRE-REQUISITE RECOVERY
    # The reported dpkg failure says gnupg is present but not
    # configured. Configure ONLY gnupg; do not run dpkg --configure -a
    # because other pending packages may have unrelated install hooks.
    # --------------------------------------------------------

    - name: Check current gnupg package status
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - "-f=${Status}"
          - gnupg
      register: gnupg_status_before
      changed_when: false
      failed_when: false
      become: true

    - name: Stop if gnupg is not installed on the client
      ansible.builtin.assert:
        that:
          - gnupg_status_before.rc == 0
          - >-
            (gnupg_status_before.stdout | trim) in
            ['install ok installed', 'install ok unpacked',
             'install ok half-configured', 'install ok triggers-awaited',
             'install ok triggers-pending']
        fail_msg: >-
          The venv-salt-minion package depends on gnupg, but gnupg is missing
          or is in an unsupported dpkg state on this client. No package upgrade
          or bulk dpkg repair was attempted. Check dpkg-query for gnupg and
          provide its required dependency packages through the AWX offline bundle.
      become: true

    - name: Configure only gnupg when it is unpacked or not yet configured
      ansible.builtin.command:
        argv:
          - dpkg
          - --configure
          - gnupg
      register: gnupg_configure
      changed_when: gnupg_configure.rc == 0
      when: (gnupg_status_before.stdout | trim) != 'install ok installed'
      become: true

    - name: Verify gnupg is fully configured
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - "-f=${Status}"
          - gnupg
      register: gnupg_status_after
      changed_when: false
      failed_when: gnupg_status_after.stdout | trim != 'install ok installed'
      become: true

    - name: Install Uyuni Salt Minion from local DEB
      ansible.builtin.command:
        argv:
          - dpkg
          - --install
          - /root/uyuni_offline/venv-salt-minion.deb
      register: minion_install
      changed_when: minion_install.rc == 0
      become: true

    - name: Verify Uyuni Salt Minion installation
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - "-f=${Status}"
          - venv-salt-minion
      register: package_status
      changed_when: false
      failed_when: package_status.stdout | trim != "install ok installed"
      become: true

    # --------------------------------------------------------
    # MACHINE ID + SALT MINION ID (NEW CLONES ONLY)
    # No SSH settings or Salt master connection settings are changed.
    # --------------------------------------------------------

    - name: Read existing machine ID before clone identity reset
      ansible.builtin.command:
        argv:
          - cat
          - /etc/machine-id
      register: old_machine_id
      changed_when: false
      when: uyuni_reset_clone_identity | bool
      become: true

    - name: Read this client's FQDN for its Salt Minion ID
      ansible.builtin.command:
        argv:
          - hostname
          - -f
      register: clone_fqdn
      changed_when: false
      when: uyuni_reset_clone_identity | bool
      become: true

    - name: Validate the new clone has a valid FQDN
      ansible.builtin.assert:
        that:
          - clone_fqdn.stdout | trim | length >= 3
          - "'.' in (clone_fqdn.stdout | trim)"
          - clone_fqdn.stdout | trim is match('^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$')
        fail_msg: "Set a unique client hostname/FQDN before resetting its Salt identity."
      when: uyuni_reset_clone_identity | bool

    - name: Stop Salt Minion before resetting clone identity
      ansible.builtin.systemd:
        name: venv-salt-minion.service
        state: stopped
      when: uyuni_reset_clone_identity | bool
      become: true

    - name: Remove existing machine ID files on the new clone
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/machine-id
        - /var/lib/dbus/machine-id
      when: uyuni_reset_clone_identity | bool
      become: true

    - name: Generate a new machine ID
      ansible.builtin.command:
        argv:
          - systemd-machine-id-setup
      register: machine_id_setup
      changed_when: true
      when: uyuni_reset_clone_identity | bool
      become: true

    - name: Read regenerated machine ID
      ansible.builtin.command:
        argv:
          - cat
          - /etc/machine-id
      register: new_machine_id
      changed_when: false
      when: uyuni_reset_clone_identity | bool
      become: true

    - name: Verify the new machine ID is valid and different
      ansible.builtin.assert:
        that:
          - new_machine_id.stdout | trim is match('^[0-9a-fA-F]{32}$')
          - new_machine_id.stdout | trim != old_machine_id.stdout | trim
        fail_msg: "Machine ID regeneration failed. Salt Minion will not be restarted."
      when: uyuni_reset_clone_identity | bool

    - name: Remove the cloned Salt Minion key pair
      ansible.builtin.file:
        path: "{{ uyuni_salt_pki_dir }}"
        state: absent
      when: uyuni_reset_clone_identity | bool
      become: true

    - name: Set a unique Salt Minion ID from the client's FQDN
      ansible.builtin.copy:
        dest: "{{ uyuni_salt_minion_id_file }}"
        content: "{{ clone_fqdn.stdout | trim }}\n"
        owner: root
        group: root
        mode: "0644"
      when: uyuni_reset_clone_identity | bool
      become: true

    # --------------------------------------------------------
    # UYUNI CONFIGURATION
    # --------------------------------------------------------

    - name: Create Uyuni configuration directory
      ansible.builtin.file:
        path: /etc/venv-salt-minion/minion.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Configure Uyuni Salt Minion
      ansible.builtin.copy:
        dest: /etc/venv-salt-minion/minion.d/uyuni.conf
        content: |
          master: {{ uyuni_master }}
          server_id_use_crc: adler32
          enable_legacy_startup_events: False
          enable_fqdns_grains: False

          grains:
            susemanager:
              activation_key: "{{ uyuni_activation_key }}"
        owner: root
        group: root
        mode: "0640"
      no_log: true
      register: minion_configuration
      become: true

    # --------------------------------------------------------
    # START SERVICE
    # --------------------------------------------------------

    - name: Enable and start Uyuni Salt Minion
      ansible.builtin.systemd:
        name: venv-salt-minion
        enabled: true
        state: restarted
      become: true

    # --------------------------------------------------------
    # VERIFICATION
    # --------------------------------------------------------

    - name: Verify package installation
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - "-f=${Status}"
          - venv-salt-minion
      register: package_status
      changed_when: false
      failed_when: package_status.stdout | trim != "install ok installed"
      become: true

    - name: Verify minion service
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - venv-salt-minion
      register: service_status
      changed_when: false
      failed_when: service_status.stdout | trim != "active"
      become: true

    # --------------------------------------------------------
    # CLEANUP
    # --------------------------------------------------------

    - name: Remove temporary DEB package after successful installation
      ansible.builtin.file:
        path: "{{ target_staging_dir }}"
        state: absent
      become: true

    - name: Display final installation report
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "UYUNI OFFLINE INSTALLATION SUCCESS"
          - "=========================================="
          - "Client: {{ inventory_hostname }}"
          - "OS: {{ ansible_facts['distribution'] }}"
          - "Machine ID: {{ new_machine_id.stdout | trim if (uyuni_reset_clone_identity | bool) else 'preserved (existing client)' }}"
          - "Salt Minion ID: {{ clone_fqdn.stdout | trim if (uyuni_reset_clone_identity | bool) else 'preserved (existing client)' }}"
          - "Identity reset requested: {{ uyuni_reset_clone_identity }}"
          - "Package: venv-salt-minion"
          - "Version: {{ hostvars['localhost']['uyuni_awx_deb_version'] }}"
          - "Package status: {{ package_status.stdout | trim }}"
          - "Service status: {{ service_status.stdout | trim }}"
          - "Uyuni master: {{ uyuni_master }}"
          - "Activation key: {{ uyuni_activation_key }}"
          - "=========================================="
